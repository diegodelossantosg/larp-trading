name: "Replay data: half-hourly prices for the news days"

# Research only. Saves research/replay/halfhour.csv.gz (prices at 10:00, 10:30 ... 15:30 New York time).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  halfhour:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: ./setup.sh
      - timeout-minutes: 320
        run: python -m trader.replay_data halfhour --needed research/replay/needed.csv.gz --out research/replay/halfhour.csv.gz
      - name: Save
        if: always()
        run: |
          git config user.name "trading-agent"
          git config user.email "trading-agent@users.noreply.github.com"
          git add research/replay/halfhour.csv.gz || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Research: half-hourly replay prices"
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0; sleep 7; done
          exit 1
