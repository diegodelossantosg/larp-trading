name: Watcher (every 10 min)

# Rules-only price check between Claude's daily decisions: trailing stops and breakout buys,
# and a live portfolio value for the dashboard. Runs from the default branch (main).
# No Claude call, so it needs only the Alpaca secrets. It does nothing while the market is closed.
on:
  schedule:
    - cron: "*/10 13-21 * * 1-5"
  workflow_dispatch:

concurrency:
  group: trading-agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_PAPER: ${{ vars.ALPACA_PAPER || 'true' }}
      LIVE_TRADING_CONFIRMED: ${{ vars.LIVE_TRADING_CONFIRMED || 'no' }}
      TRADING_ENABLED: ${{ vars.TRADING_ENABLED || 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: ./setup.sh
      - run: python -m trader.main watch
      - name: Save journal
        if: always()
        run: |
          git config user.name "trading-agent"
          git config user.email "trading-agent@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Watch: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
