name: Watcher (every minute)

# Price check between Claude's daily decisions: trailing stops (instant, rules) and signal-based
# buys (each approved by Opus),
# and a live portfolio value for the dashboard.
#
# GitHub's own timer is unreliable for every-10-minute jobs, so instead one job per trading day
# loops: check, save, wait a minute, repeat, and stops when the market closes. The schedule
# below starts it a few times as a safety net; extra starts just wait in line and exit at once.
on:
  schedule:
    - cron: "40 13 * * 1-5"
    - cron: "40 14 * * 1-5"
    - cron: "40 16 * * 1-5"
    - cron: "40 18 * * 1-5"
  workflow_dispatch:

concurrency:
  group: watcher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_PAPER: ${{ vars.ALPACA_PAPER || 'true' }}
      LIVE_TRADING_CONFIRMED: ${{ vars.LIVE_TRADING_CONFIRMED || 'no' }}
      TRADING_ENABLED: ${{ vars.TRADING_ENABLED || 'true' }}
      # Opus approves every watcher buy. Without this token the watcher still runs its stops,
      # but makes no buys. Create it with `claude setup-token`.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: ./setup.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code (for Opus approval of buys)
        run: npm install -g @anthropic-ai/claude-code@2.1.296
      - name: Check every minute until the close
        run: |
          git config user.name "trading-agent"
          git config user.email "trading-agent@users.noreply.github.com"
          # Check every minute. Changes are folded into one local commit and published every
          # 5 minutes, or right away after a trade, so GitHub isn't flooded with commits.
          sync() {
            git pull -q --rebase -X theirs origin main || { git rebase --abort; echo "sync failed"; }
          }
          publish() {
            [ -n "$(git log origin/main..HEAD --oneline)" ] || return 0
            for j in 1 2 3; do sync; git push -q origin HEAD:main && return 0; sleep 5; done
            echo "push failed"
          }
          i=0
          while python -m trader.main market-open; do
            before=$(md5sum docs/data/decisions.json 2>/dev/null)
            python -m trader.main watch || echo "watch run failed"
            git add docs/data
            if ! git diff --cached --quiet; then
              if [ -n "$(git log origin/main..HEAD --oneline)" ]; then git commit -q --amend --no-edit
              else git commit -q -m "Watch: $(date -u +%Y-%m-%dT%H:%MZ)"; fi
            fi
            if [ $((i % 5)) -eq 4 ] || [ "$before" != "$(md5sum docs/data/decisions.json 2>/dev/null)" ]; then
              publish
            else
              sync
            fi
            i=$((i + 1))
            sleep 60
          done
          publish
          echo "market closed; done for today"
