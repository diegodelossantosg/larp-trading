name: Watcher (every minute)

# Price check between Claude's daily decisions: trailing stops (instant, rules) and signal-based
# buys (each approved by Opus),
# and a live portfolio value for the dashboard.
#
# GitHub's own timer is unreliable for every-10-minute jobs, so instead one job per trading day
# loops: check, save, wait a minute, repeat. GitHub ends any job after 6 hours, so after 5h40 the job
# starts its own successor (it waits in line until this one ends), day and night. While it runs it is also
# the supervisor: it starts the daily decision, the hourly News Hunter and the one-time sale when they are
# missing. The schedule below and the watchdog workflow are only extra safety nets.
on:
  schedule:
    - cron: "40 13 * * 1-5"
    - cron: "40 14 * * 1-5"
    - cron: "40 16 * * 1-5"
    - cron: "40 18 * * 1-5"
  workflow_dispatch:

concurrency:
  group: watcher
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # to start the next watcher run

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # GitHub's own limit is 360
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_PAPER: ${{ vars.ALPACA_PAPER || 'true' }}
      LIVE_TRADING_CONFIRMED: ${{ vars.LIVE_TRADING_CONFIRMED || 'no' }}
      TRADING_ENABLED: ${{ vars.TRADING_ENABLED || 'true' }}
      GH_TOKEN: ${{ github.token }}
      AGENTS_ON: ${{ vars.AGENTS_ON_GITHUB }}
      # Opus approves every watcher buy. Without this token the watcher still runs its stops,
      # but makes no buys. Create it with `claude setup-token`.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: ./setup.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code (for Opus approval of buys)
        run: npm install -g @anthropic-ai/claude-code@2.1.296
      - name: Check every minute until the close
        run: |
          git config user.name "trading-agent"
          git config user.email "trading-agent@users.noreply.github.com"
          # Check every minute. Changes are folded into one local commit and published every
          # 15 minutes, or right away after a trade, so GitHub Pages can finish publishing the page
          # between data commits (every commit restarts and cancels the previous publish).
          sync() {
            git pull -q --rebase -X theirs origin main || { git rebase --abort; echo "sync failed"; }
          }
          publish() {
            [ -n "$(git log origin/main..HEAD --oneline)" ] || return 0
            for j in 1 2 3; do sync; git push -q origin HEAD:main && return 0; sleep 5; done
            echo "push failed"
          }
          # Every minute: a tiny live.json (value, holdings, latest chart points) is force-pushed as
          # the only file of the "live" branch. That branch doesn't rebuild the GitHub Pages site, and
          # the dashboard reads it through the GitHub API, so it can refresh every minute.
          publish_live() {
            # live.json for the GitHub API (always fresh, 60 requests/hour per visitor) plus one copy per
            # minute, m-HHMM.json, for plain file links (cached 5 minutes, but each minute has a new name).
            python -m trader.live > /tmp/live.json || return 0
            mkdir -p /tmp/livem && cp /tmp/live.json "/tmp/livem/m-$(date -u +%H%M).json"
            ls -1 /tmp/livem | sort | head -n -10 | while read -r old; do rm -f "/tmp/livem/$old"; done
            tree=$( { printf "100644 blob %s\tlive.json\n" "$(git hash-object -w /tmp/live.json)"
                      for f in /tmp/livem/*.json; do printf "100644 blob %s\t%s\n" "$(git hash-object -w "$f")" "$(basename "$f")"; done
                    } | git mktree)
            commit=$(git commit-tree "$tree" -m "live $(date -u +%H:%M)")
            git push -q -f origin "$commit:refs/heads/live" || echo "live push failed"
          }
          # The supervisor part: every 5 minutes ask the watchdog which agents should be running by now
          # but aren't (daily decision, News Hunter every hour, the one-time sale) and start them. This
          # job runs all day and night, so none of it depends on GitHub's unreliable timer.
          supervise() {
            missing=$(python -m trader.watchdog | tail -n 1)
            echo "supervisor: missing $missing"
            for agent in $(echo "$missing" | python -c "import json,sys; print(' '.join(json.load(sys.stdin)))"); do
              case "$agent" in
                trade) wf=trade.yml ;;
                news) wf=hunter.yml ;;
                liquidate) wf=liquidate.yml ;;
                *) continue ;;
              esac
              echo "supervisor: starting $agent ($wf)"
              gh workflow run "$wf" --ref main || echo "could not start $wf"
            done
          }
          i=0
          while true; do
            if python -m trader.main market-open; then
              before=$(md5sum docs/data/decisions.json 2>/dev/null)
              python -m trader.main watch || echo "watch run failed"
              publish_live
              git add docs/data
              if ! git diff --cached --quiet; then
                if [ -n "$(git log origin/main..HEAD --oneline)" ]; then git commit -q --amend --no-edit
                else git commit -q -m "Watch: $(date -u +%Y-%m-%dT%H:%MZ)"; fi
              fi
              if [ $((i % 15)) -eq 0 ] || [ "$before" != "$(md5sum docs/data/decisions.json 2>/dev/null)" ]; then
                publish
              else
                sync
              fi
              [ $((i % 5)) -eq 2 ] && supervise
            else
              # market closed: only keep the dashboard's repo copy fresh now and then, and check the supervisor list
              [ $((i % 30)) -eq 0 ] && sync
              [ $((i % 5)) -eq 2 ] && supervise
            fi
            i=$((i + 1))
            [ "$SECONDS" -ge 20400 ] && break   # 5h40: hand over before GitHub's 6-hour limit
            sleep 60
          done
          publish
          # Always start the successor, so the supervisor never stops (it waits in line until this one ends).
          # To stop everything on purpose, set the repository variable AGENTS_ON_GITHUB to anything but "true".
          if [ "$AGENTS_ON" = "true" ] || python -m trader.main market-open; then
            echo "starting the next watcher run"
            gh workflow run watch.yml --ref main
          else
            echo "agents are switched off and the market is closed; stopping"
          fi
