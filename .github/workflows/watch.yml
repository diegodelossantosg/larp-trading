name: Watcher (every 5 min)

# Price check between Claude's daily decisions: trailing stops (instant, rules) and signal-based
# buys (each approved by Opus),
# and a live portfolio value for the dashboard.
#
# GitHub's own timer is unreliable for every-10-minute jobs, so instead one job per trading day
# loops: check, save, wait 5 minutes, repeat, and stops when the market closes. The schedule
# below starts it a few times as a safety net; extra starts just wait in line and exit at once.
on:
  schedule:
    - cron: "40 13 * * 1-5"
    - cron: "40 14 * * 1-5"
    - cron: "40 16 * * 1-5"
    - cron: "40 18 * * 1-5"
  workflow_dispatch:

concurrency:
  group: watcher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_PAPER: ${{ vars.ALPACA_PAPER || 'true' }}
      LIVE_TRADING_CONFIRMED: ${{ vars.LIVE_TRADING_CONFIRMED || 'no' }}
      TRADING_ENABLED: ${{ vars.TRADING_ENABLED || 'true' }}
      # Opus approves every watcher buy. Without this token the watcher still runs its stops,
      # but makes no buys. Create it with `claude setup-token`.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: ./setup.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code (for Opus approval of buys)
        run: npm install -g @anthropic-ai/claude-code@2.1.296
      - name: Check every 5 minutes until the close
        run: |
          git config user.name "trading-agent"
          git config user.email "trading-agent@users.noreply.github.com"
          save() {
            git add docs/data
            git diff --cached --quiet && return 0
            git commit -q -m "Watch: $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && return 0; sleep 5; done
            echo "push failed"
          }
          while python -m trader.main market-open; do
            git pull -q --rebase origin main || true
            python -m trader.main watch || echo "watch run failed"
            save
            sleep 300
          done
          echo "market closed; done for today"
