name: "Backtest intraday candles (realistic costs)"

# Same-day candlestick trades on 5m/15m/30m/1h candles with per-symbol costs,
# design vs validation, same-time random controls and a luck check.
on:
  workflow_dispatch:
    inputs:
      years:
        description: "Years of 5-minute history"
        default: "5"

permissions:
  contents: write

jobs:
  intraday-candles:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: ./setup.sh
      - run: python -m trader.intraday_candles --years ${{ inputs.years }}
      - name: Save results
        run: |
          git config user.name "trading-agent"
          git config user.email "trading-agent@users.noreply.github.com"
          git add docs/data/intraday_candles.json
          git commit -q -m "Backtest: intraday candles, ${{ inputs.years }} years"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
