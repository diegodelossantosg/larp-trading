name: "Candle luck check (dragonfly doji) + 1-minute candles"

# Is the dragonfly-doji result luck? New stocks, nudged rules, 1,000 random sets. Plus patterns on 1-minute candles.
on:
  workflow_dispatch:
    inputs:
      minute_months:
        description: "Months of 1-minute history"
        default: "6"
      daily_years:
        description: "Years of daily history"
        default: "8"

permissions:
  contents: write

jobs:
  candle_luck:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: ./setup.sh
      - run: python -m trader.candle_luck --minute-months ${{ inputs.minute_months }} --daily-years ${{ inputs.daily_years }}
      - name: Save results
        run: |
          git config user.name "trading-agent"
          git config user.email "trading-agent@users.noreply.github.com"
          git add docs/data/candle_luck.json
          git commit -q -m "Backtest: candle luck check"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
