name: "Build the event dataset (earnings + news moves)"

# Every earnings and news-move event with prices at several entry times, for the local research loop.
on:
  workflow_dispatch:
    inputs:
      months:
        description: "Months of headlines"
        default: "40"
      top:
        description: "Companies ranked 101..top by 2018 dollar volume"
        default: "300"
      out:
        description: "Output file"
        default: "research/events.csv.gz"
      no_big:
        description: "Leave out the big, biased-up companies"
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  events:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: ./setup.sh
      - run: python -m trader.event_dataset --months ${{ inputs.months }} --top ${{ inputs.top }} --out ${{ inputs.out }} ${{ inputs.no_big && '--no-big' || '' }}
      - name: Save results
        run: |
          git config user.name "trading-agent"
          git config user.email "trading-agent@users.noreply.github.com"
          git add ${{ inputs.out }}
          git commit -q -m "Research: event dataset"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
