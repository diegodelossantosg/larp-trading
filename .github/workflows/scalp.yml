name: Backtest scalping

# Tests three minute-level scalping strategies on real 1-minute bars, after costs.
on:
  workflow_dispatch:
    inputs:
      months:
        description: "How many months of 1-minute history"
        default: "3"

permissions:
  contents: write

jobs:
  scalp:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: ./setup.sh
      - run: python -m trader.scalp_backtest --months ${{ inputs.months }}
      - name: Save results
        run: |
          git config user.name "trading-agent"
          git config user.email "trading-agent@users.noreply.github.com"
          git add docs/data/scalp_backtest.json
          git commit -q -m "Backtest: scalping, ${{ inputs.months }} months"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
