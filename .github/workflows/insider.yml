name: "Download insider purchases (SEC Form 4, since 2016)"

# Every officer/director open-market purchase from the SEC's quarterly data sets, for the lab.
on:
  workflow_dispatch:
    inputs:
      contact_email:
        description: "Contact email the SEC requires (logs are deleted after the run)"
        required: true

permissions:
  contents: write

jobs:
  insider:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: ./setup.sh
      - run: python -m trader.insider_data --contact "$SEC_CONTACT"
        env:
          SEC_CONTACT: ${{ inputs.contact_email }}
      - name: Save results
        run: |
          git config user.name "trading-agent"
          git config user.email "trading-agent@users.noreply.github.com"
          git add research/insider_buys.csv.gz
          git commit -q -m "Research: insider purchases"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
