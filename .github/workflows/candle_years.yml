name: "Candlestick patterns, one year at a time"

# 16 candlestick patterns on the daily candles of each year's ~500 most-traded stocks (2016 to now),
# year by year: does the pattern make money after costs, and does it beat ordinary days in the same situation?
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  candles:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: ./setup.sh
      - run: python -m trader.candle_years
      - name: Save results
        run: |
          git config user.name "trading-agent"
          git config user.email "trading-agent@users.noreply.github.com"
          git add docs/data/candle_years.json
          git commit -q -m "Backtest: candlestick patterns year by year"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
