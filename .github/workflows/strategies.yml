name: Backtest strategies

# Compares systematic ETF strategies (trend filter, 2x with trend filter, sector momentum,
# dual momentum) with buying and holding SPY, on daily data since 2016.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  strategies:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: ./setup.sh
      - run: python -m trader.strategy_backtest
      - name: Save results
        run: |
          git config user.name "trading-agent"
          git config user.email "trading-agent@users.noreply.github.com"
          git add docs/data/strategy_backtest.json
          git commit -q -m "Backtest: systematic strategies"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
