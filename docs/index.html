<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My AI Investor</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232a78d6'/%3E%3Cpolyline points='10,46 24,32 34,40 52,18' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpolyline points='40,18 52,18 52,30' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --good: #006300;
  --bad: #d03b3b;
  --chip: #f0efec;
  --note: #eef4fc;
  --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c8: #e34948;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --series-1: #3987e5; --series-2: #d95926; --good: #0ca30c; --bad: #e66767; --chip: #262624; --note: #17222f;
    --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --series-1: #3987e5; --series-2: #d95926; --good: #0ca30c; --bad: #e66767; --chip: #262624; --note: #17222f;
  --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { margin: 0 auto; padding: 16px 24px 48px; }
.top-grid { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(380px, 1fr); gap: 16px; margin-top: 16px; align-items: start; }
.bottom-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; margin-top: 16px; align-items: start; }
.top-grid > .card, .bottom-grid > .card { margin-top: 0; }
.col { display: flex; flex-direction: column; gap: 16px; }
.col > .card { margin-top: 0; }
@media (max-width: 1100px) { .top-grid, .bottom-grid { grid-template-columns: minmax(0, 1fr); } }
.hero { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 24px; margin-top: 0; }
.hero .label { font-size: 13px; font-weight: 600; opacity: .85; text-transform: uppercase; letter-spacing: .04em; }
.hero .side:last-child { text-align: right; }
.hero .today-line { margin-top: 10px; font-size: 15px; font-weight: 600; }
.hero .pill { display: inline-block; font-size: 17px; font-weight: 700; padding: 2px 12px; border-radius: 99px; margin-left: 6px; }
.hero .versus { text-align: center; font-size: 15px; font-weight: 600; padding: 12px 20px; border-radius: 14px; background: rgba(255,255,255,.14); }
.hero .versus b { display: block; font-size: 26px; margin: 2px 0; }
.hero .versus.up b { color: #b8f5b8; } .hero .versus.down b { color: #ffc4c4; }
@media (max-width: 700px) { .hero { grid-template-columns: 1fr; } .hero .side:last-child { text-align: left; } }
.hero .up-bg { background: rgba(12,163,12,.85); } .hero .down-bg { background: rgba(208,59,59,.9); } .hero .flat-bg { background: rgba(255,255,255,.18); }
h1 { font-size: 24px; margin: 0; }
h2 { font-size: 18px; margin: 0 0 4px; }
p { margin: 6px 0; }
.sub { color: var(--ink-2); font-size: 14px; }
.small { font-size: 13px; color: var(--ink-2); }
.banner { background: var(--note); border-radius: 10px; padding: 10px 14px; margin: 12px 0 0; font-size: 14px; }
.banner.live { background: var(--bad); color: #fff; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-top: 16px; }
.hero { font-size: 18px; line-height: 1.5; }
.hero .big { font-size: 38px; font-weight: 700; display: block; margin: 0 0 4px; }
.verdict { display: inline-block; margin-top: 8px; padding: 6px 12px; border-radius: 99px; font-weight: 600; background: var(--chip); }
.up { color: var(--good); } .down { color: var(--bad); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 16px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
.tile .label { color: var(--ink-2); font-size: 13px; font-weight: 600; }
.tile .value { font-size: 24px; font-weight: 700; margin: 2px 0; }
.tile .hint { color: var(--ink-2); font-size: 13px; }
.steps { margin: 8px 0 0; padding-left: 20px; }
.steps li { margin: 4px 0; }
.legend { display: flex; gap: 16px; font-size: 14px; color: var(--ink-2); margin: 10px 0 8px; flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; width: 16px; height: 3px; vertical-align: middle; margin-right: 6px; background: var(--c); border-radius: 2px; }
.legend .dash::before { background: repeating-linear-gradient(90deg, var(--c) 0 4px, transparent 4px 7px); }
.chart-wrap { position: relative; }
svg { display: block; overflow: visible; }
.tooltip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.12); display: none; white-space: nowrap; z-index: 2; }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
button.link { background: none; border: 1px solid var(--border); color: var(--ink-2); border-radius: 8px; padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; }
.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 8px; }
th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { color: var(--ink-2); font-weight: 500; font-size: 13px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.entry { border-top: 1px solid var(--grid); padding: 14px 0; }
.entry:first-of-type { border-top: 0; }
.entry .when { font-weight: 700; }
.chip { display: inline-block; background: var(--chip); border-radius: 99px; padding: 0 9px; font-size: 12px; color: var(--ink-2); margin-left: 6px; }
.action { margin: 6px 0; font-weight: 600; }
ul.why { margin: 6px 0 0; padding-left: 18px; }
ul.why li { margin: 4px 0; }
details { margin-top: 8px; font-size: 14px; color: var(--ink-2); }
details a { color: var(--series-1); }
summary { cursor: pointer; }
.error { color: var(--bad); }
.empty { color: var(--ink-2); padding: 16px 0; }
dl.glossary dt { font-weight: 700; margin-top: 10px; }
dl.glossary dd { margin: 2px 0 0; color: var(--ink-2); }
.footer { color: var(--muted); font-size: 12px; margin-top: 24px; }

.hero { background: linear-gradient(135deg, #2a78d6 0%, #6250d6 100%); color: #fff; border: 0; }
.hero .small { color: rgba(255,255,255,.8); }
.hero .up, .hero .down { color: #fff; }
.hero .verdict { background: rgba(255,255,255,.18); color: #fff; }
.hero .delta { display: inline-block; padding: 1px 10px; border-radius: 99px; font-weight: 700; }
.hero .delta.up { background: rgba(12,163,12,.85); }
.hero .delta.down { background: rgba(208,59,59,.9); }
.tile { border-top: 4px solid var(--accent); }
.tile:nth-child(1) { --accent: var(--series-1); }
.tile:nth-child(2) { --accent: var(--c3); }
.tile:nth-child(3) { --accent: var(--series-2); }
.tile:nth-child(4) { --accent: var(--c7); }
.alloc { display: flex; gap: 2px; height: 14px; border-radius: 7px; overflow: hidden; margin: 10px 0 4px; }
.alloc span { display: block; height: 100%; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: baseline; }
.tag { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 13px; font-weight: 600; margin: 2px 4px 2px 0; }
.tag.buy { background: rgba(12,163,12,.14); color: var(--good); }
.tag.sell { background: rgba(208,59,59,.14); color: var(--bad); }
.tag.trim { background: rgba(237,161,0,.18); color: #9a6700; }
.tag.hold { background: var(--chip); color: var(--ink-2); }
.mood-badge { display: inline-block; font-weight: 700; font-size: 16px; padding: 4px 12px; border-radius: 99px; margin: 4px 0 10px; }
.mood-healthy { background: rgba(12,163,12,.15); color: var(--good); }
.mood-cautious { background: rgba(237,161,0,.2); color: var(--ink); }
.mood-stressed { background: rgba(208,59,59,.15); color: var(--bad); }
.gauges { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.gauge { background: var(--chip); border-radius: 10px; padding: 8px 10px; }
.gauge .label { font-size: 12px; color: var(--ink-2); }
.gauge .value { font-size: 18px; font-weight: 700; }
.events { margin: 10px 0 0; padding-left: 18px; font-size: 14px; }
.intervals { display: inline-flex; gap: 2px; background: var(--chip); border-radius: 8px; padding: 2px; margin-left: auto; margin-right: 8px; }
.intervals button { border: 0; background: none; font: inherit; font-size: 12px; font-weight: 600; color: var(--ink-2); padding: 3px 9px; border-radius: 6px; cursor: pointer; }
.intervals button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.holdings-wrap { display: flex; gap: 20px; align-items: center; }
.holdings-wrap table { flex: 1; min-width: 0; }
.donut { flex: none; }
@media (max-width: 700px) { .holdings-wrap { flex-direction: column; } }
details.log > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
details.log > summary::-webkit-details-marker { display: none; }
details.log > summary::after { content: "▾"; color: var(--ink-2); font-size: 16px; transition: transform .15s; }
details.log:not([open]) > summary::after { transform: rotate(-90deg); }
details.log > summary h2 { margin: 0; }
details.log[open] > summary { margin-bottom: 8px; }
.moves { display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; margin-top: 8px; align-items: center; }
.move { display: contents; }
.move > span:last-child { font-size: 14px; color: var(--ink-2); }
.chip.auto { background: rgba(237,161,0,.18); color: var(--ink); }
.chip.news { background: rgba(214,65,140,.16); color: var(--ink); }
h2 { display: flex; align-items: center; gap: 8px; }
h3.sub { font-size: 15px; margin: 18px 0 6px; }
.stats { display: flex; flex-wrap: wrap; gap: 10px; margin: 4px 0 12px; }
.stat { background: var(--chip); border-radius: 10px; padding: 6px 12px; min-width: 90px; }
.stat b { font-size: 18px; display: block; }
table.sold td { vertical-align: top; }
table.sold td.comment { font-size: 13px; color: var(--ink-2); min-width: 180px; }
#sold-card { display: flex; flex-direction: column; }
#sold { flex: 1 1 0; min-height: 0; overflow-y: auto; max-height: 560px; }
details.sold-day { border-top: 1px solid var(--border); }
details.sold-day > summary { cursor: pointer; padding: 8px 0; font-weight: 600; display: flex; gap: 10px; align-items: baseline; }
details.sold-day > summary .small { font-weight: 400; }
details.sold-day > summary b { margin-left: auto; }
details.old-logs { margin-top: 12px; border-top: 1px solid var(--line, #e5e5e5); padding-top: 8px; }
details.old-logs > summary { cursor: pointer; font-weight: 600; color: var(--ink-2); padding: 6px 0; }
h2::before { content: ""; width: 4px; height: 18px; border-radius: 2px; background: var(--h, var(--series-1)); }
</style>
</head>
<body>
<main>
  <div class="banner live" id="mode" hidden></div>

  <section class="card hero" id="hero"></section>

  <div class="top-grid">
    <section class="card">
      <div class="toolbar">
        <h2 style="--h: var(--series-1)">AI vs S&amp;P 500</h2>
        <div class="intervals" id="intervals">
          <button data-iv="1m">1m</button><button data-iv="5m">5m</button><button data-iv="15m">15m</button><button data-iv="1H">1H</button><button data-iv="1D">1D</button>
        </div>
        <button class="link" id="toggle-table">Table</button>
      </div>
      <div class="legend">
        <span style="--c: var(--series-1)">AI portfolio</span>
        <span class="dash" style="--c: var(--series-2)">S&amp;P 500</span>
      </div>
      <div class="chart-wrap" id="chart"></div>
      <div class="table-scroll" id="chart-table" hidden></div>
    </section>

    <section class="card">
      <h2 style="--h: var(--c6)">Closed trades</h2>
      <div id="closed-summary" class="small"></div>
      <div class="table-scroll" id="closed"></div>
    </section>
  </div>

  <div class="bottom-grid">
    <section class="card">
      <h2 style="--h: var(--c3)">Holdings</h2>
      <div class="table-scroll" id="holdings"></div>
    </section>

    <section class="card" id="sold-card">
      <h2 style="--h: var(--c5)">Sold</h2>
      <div class="small">Partial sales (trims): we sold part and still hold the rest. Full sales are in "Closed trades".</div>
      <div id="sold-summary"></div>
      <div class="table-scroll" id="sold"></div>
    </section>

    <section class="card">
      <h2 style="--h: var(--c4)">Who's earning</h2>
      <div class="table-scroll" id="scorecard"></div>
      <h3 class="sub">🧠 Claude's report card <span class="small">· its picks by kind of trade, vs the S&amp;P 500</span></h3>
      <div class="table-scroll" id="report-card"></div>
    </section>

    <details class="card log" id="log-card" open>
      <summary><h2 style="--h: var(--c7)">Daily log</h2></summary>
      <div id="decisions"></div>
    </details>
  </div>
</main>

<div class="tooltip" id="tooltip"></div>

<script>
const $ = (id) => document.getElementById(id);
const usd = (v, d = 2) => v == null ? "–" : v.toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: d, minimumFractionDigits: d });
const signedUsd = (v) => v == null ? "–" : (v > 0 ? "+" : v < 0 ? "−" : "") + usd(Math.abs(v));
const pct = (v, d = 2) => v == null ? "–" : (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(d) + "%";
const cls = (v) => v > 0.005 ? "up" : v < -0.005 ? "down" : "";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// Read the data straight from the repo (updated every 5 minutes) so the page doesn't wait for a
// GitHub Pages rebuild; fall back to the copy published with the page.
const RAW = "https://raw.githubusercontent.com/diegodelossantosg/larp-trading/main/docs/data/";
async function load(name, fallback) {
  for (const url of [`${RAW}${name}?t=${Date.now()}`, `data/${name}?t=${Date.now()}`]) {
    try { const r = await fetch(url, { cache: "no-store" }); if (r.ok) return await r.json(); } catch {}
  }
  return fallback;
}

function hero(status, equity) {
  const capital = status.capital || equity[0]?.equity || null;
  const now = status.equity ?? equity.at(-1)?.equity ?? capital;
  if (now == null) {
    $("hero").innerHTML = `<p class="small">Waiting for the first run.</p>`;
    return;
  }
  const start = capital ?? equity[0]?.equity;
  const todayStr = new Date().toLocaleDateString("en-CA", { timeZone: "America/New_York" });
  const prevRow = equity.filter((r) => r.date < todayStr).at(-1);
  // The same starting money put in the S&P 500 (SPY) on day one, valued at SPY's latest price.
  const pts = (DATA.intraday.points || []).filter((p) => p[2] != null);
  const spyNow = pts.at(-1)?.[2] ?? equity.at(-1)?.spy_close;
  const spyStart = status.spy_start ?? equity[0]?.spy_close;
  const spyPrev = prevRow?.spy_close ?? spyStart;
  const bench = spyNow && spyStart ? start * spyNow / spyStart : null;
  const benchPrev = bench != null ? start * spyPrev / spyStart : null;
  const bg = (v) => (v > 0.005 ? "up-bg" : v < -0.005 ? "down-bg" : "flat-bg");
  const col = (label, value, prev) => {
    const total = value - start, today = value - prev;
    return `<div class="side">
      <div class="label">${label}</div>
      <span class="big">${usd(value)}</span>
      <span class="delta ${cls(total)}">${signedUsd(total)} (${pct(total / start * 100)})</span>
      <div class="today-line">Today <span class="pill ${bg(today)}">${today >= 0 ? "▲" : "▼"} ${signedUsd(today)} (${pct(today / prev * 100)})</span></div>
    </div>`;
  };
  const gap = bench != null ? now - bench : null;
  const verdict = gap == null ? "" : Math.abs(gap) < 0.005 ? "Tied" : `AI is ${gap > 0 ? "ahead" : "behind"} by<b>${usd(Math.abs(gap))}</b>`;
  const updated = status.updated ? new Date(status.updated).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false }) : "";
  $("hero").innerHTML = `
    ${col("AI portfolio", now, prevRow?.equity ?? start)}
    <div class="versus ${gap == null ? "" : cls(gap)}">${verdict}${updated ? `<div class="small">Updated ${updated}</div>` : ""}</div>
    ${bench != null ? col("All in the S&amp;P 500", bench, benchPrev) : `<div class="side"></div>`}`;
}

const DATA = { status: {}, equity: [], intraday: {} };
const INTERVALS = { "1m": [1, 1], "5m": [5, 2], "15m": [15, 5], "1H": [60, 5], "1D": [0, 0] };  // minutes, sessions shown
let interval = (() => { try { return localStorage.getItem("interval") || "5m"; } catch { return "5m"; } })();

function seriesFor(iv, equity, intraday, status) {
  if (iv === "1D") {
    const rows = equity.slice();
    const pts = intraday.points || [];
    const today = new Date().toLocaleDateString("en-CA", { timeZone: "America/New_York" });
    if (pts.length && status.equity != null && !rows.some((r) => r.date === today))
      rows.push({ date: today, equity: status.equity, spy_close: pts.at(-1)[2] });
    return { rows, empty: "Starts after day 2." };
  }
  const [mins, sessions] = INTERVALS[iv];
  const pts = (intraday.points || []).filter((p) => p[1] != null && p[2] != null);
  // Finish the line at the headline value so both always show the same number: the headline is the
  // account's live value, the chart's minute points come from Alpaca's minute-by-minute history.
  if (pts.length && status.equity != null && status.updated) {
    const last = pts.at(-1), liveTs = new Date(status.updated).toISOString();
    if (Math.floor(Date.parse(liveTs) / 60000) === Math.floor(Date.parse(last[0]) / 60000)) pts[pts.length - 1] = [last[0], status.equity, last[2]];
    else if (Date.parse(liveTs) > Date.parse(last[0])) pts.push([liveTs, status.equity, last[2]]);
  }
  const nyDay = (ts) => new Date(ts).toLocaleDateString("en-CA", { timeZone: "America/New_York" });
  const days = [...new Set(pts.map((p) => nyDay(p[0])))].slice(-sessions);
  const buckets = new Map();
  for (const p of pts) {
    if (!days.includes(nyDay(p[0]))) continue;
    buckets.set(Math.floor(Date.parse(p[0]) / 60000 / mins), p);  // last point in each bucket wins
  }
  const multi = days.length > 1;
  const fmt = (ts) => new Date(ts).toLocaleString([], multi ? { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false } : { hour: "2-digit", minute: "2-digit", hour12: false });
  const rows = [...buckets.values()].map((p) => ({ date: fmt(p[0]), equity: p[1], spy_close: p[2] }));
  return { rows, empty: "Intraday data appears while the market is open." };
}

function renderChart() {
  const { rows, empty } = seriesFor(interval, DATA.equity, DATA.intraday, DATA.status);
  document.querySelectorAll("#intervals button").forEach((b) => b.classList.toggle("on", b.dataset.iv === interval));
  chart(rows, empty);
}

function chart(equity, emptyMsg = "Starts after day 2.") {
  const el = $("chart");
  if (equity.length < 2) {
    el.innerHTML = `<div class="empty">${emptyMsg}</div>`;
    $("chart-table").innerHTML = "";
    return;
  }
  // S&P 500 line: what the starting capital would be worth had it gone into SPY on day one.
  const { capital, spy_start } = DATA.status;
  const fromStart = capital && spy_start;
  const base = fromStart ? capital : equity[0].equity;
  const spyBase = fromStart ? spy_start : equity[0].spy_close;
  const rows = equity.map((r) => ({ date: r.date, agent: r.equity, spy: base * r.spy_close / spyBase }));
  const W = Math.max(300, el.clientWidth), H = W < 600 ? 240 : Math.min(520, Math.max(340, Math.round(W * 0.42))), m = { t: 12, r: 70, b: 28, l: 64 };
  const xs = (i) => m.l + (i / (rows.length - 1)) * (W - m.l - m.r);
  const vals = rows.flatMap((r) => [r.agent, r.spy]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi - lo) * 0.1 || base * 0.01; lo -= pad; hi += pad;
  const ys = (v) => m.t + (1 - (v - lo) / (hi - lo)) * (H - m.t - m.b);
  const ticks = niceTicks(lo, hi, 4);
  const line = (k) => rows.map((r, i) => `${i ? "L" : "M"}${xs(i).toFixed(1)},${ys(r[k]).toFixed(1)}`).join("");
  const xTickIdx = [...new Set(W < 600 ? [0, rows.length - 1] : [0, Math.floor((rows.length - 1) / 2), rows.length - 1])];
  const last = rows.at(-1);
  let ya = ys(last.agent), yb = ys(last.spy);
  if (Math.abs(ya - yb) < 14) { const mid = (ya + yb) / 2, up = ya <= yb; ya = mid + (up ? -7 : 7); yb = mid + (up ? 7 : -7); }
  el.innerHTML = `
  <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="AI portfolio value compared with the S&P 500">
    ${ticks.map((t) => `<line x1="${m.l}" x2="${W - m.r}" y1="${ys(t)}" y2="${ys(t)}" stroke="var(--grid)"/>
      <text x="${m.l - 8}" y="${ys(t) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${usd(t, 0)}</text>`).join("")}
    ${base >= lo && base <= hi ? `<line x1="${m.l}" x2="${W - m.r}" y1="${ys(base)}" y2="${ys(base)}" stroke="var(--axis)" stroke-dasharray="2 3"/>` : ""}
    ${xTickIdx.map((i) => `<text x="${xs(i)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === rows.length - 1 ? "end" : "middle"}" font-size="11" fill="var(--muted)">${rows[i].date}</text>`).join("")}
    <defs><linearGradient id="fillA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--series-1)" stop-opacity=".25"/><stop offset="1" stop-color="var(--series-1)" stop-opacity="0"/></linearGradient></defs>
    <path d="${line("agent")}L${xs(rows.length - 1)},${H - m.b}L${xs(0)},${H - m.b}Z" fill="url(#fillA)"/>
    <path d="${line("spy")}" fill="none" stroke="var(--series-2)" stroke-width="2" stroke-dasharray="5 3" stroke-linejoin="round"/>
    <path d="${line("agent")}" fill="none" stroke="var(--series-1)" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="${W - m.r + 6}" y="${ya + 4}" font-size="11" fill="var(--ink-2)">AI</text>
    <text x="${W - m.r + 6}" y="${yb + 4}" font-size="11" fill="var(--ink-2)">S&amp;P 500</text>
    <g id="hover" style="display:none">
      <line id="hx" y1="${m.t}" y2="${H - m.b}" stroke="var(--axis)"/>
      <circle id="ha" r="4" fill="var(--series-1)" stroke="var(--surface)" stroke-width="2"/>
      <circle id="hb" r="4" fill="var(--series-2)" stroke="var(--surface)" stroke-width="2"/>
    </g>
    <rect x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}" fill="transparent" id="hit"/>
  </svg>`;
  const svg = el.querySelector("svg"), tip = $("tooltip"), g = $("hover");
  const show = (evt) => {
    const box = svg.getBoundingClientRect();
    const x = (evt.clientX - box.left) * (W / box.width);
    const i = Math.max(0, Math.min(rows.length - 1, Math.round((x - m.l) / (W - m.l - m.r) * (rows.length - 1))));
    const r = rows[i];
    g.style.display = "";
    for (const [id, attr, v] of [["hx", "x1", xs(i)], ["hx", "x2", xs(i)], ["ha", "cx", xs(i)], ["ha", "cy", ys(r.agent)], ["hb", "cx", xs(i)], ["hb", "cy", ys(r.spy)]]) $(id).setAttribute(attr, v);
    const diff = r.agent - r.spy;
    tip.innerHTML = `<div><b>${r.date}</b></div><div>AI: <b>${usd(r.agent)}</b></div><div>S&amp;P 500: <b>${usd(r.spy)}</b></div>
      <div class="${cls(diff)}">${diff >= 0 ? "AI ahead by " : "AI behind by "}${usd(Math.abs(diff))}</div>`;
    tip.style.display = "block";
    tip.style.left = Math.min(evt.clientX + 14, window.innerWidth - tip.offsetWidth - 8) + window.scrollX + "px";
    tip.style.top = evt.clientY + window.scrollY + 14 + "px";
  };
  $("hit").addEventListener("pointermove", show);
  $("hit").addEventListener("pointerleave", () => { g.style.display = "none"; tip.style.display = "none"; });
  $("chart-table").innerHTML = `<table><thead><tr><th>Day</th><th class="num">AI portfolio</th><th class="num">S&amp;P 500 (same start)</th><th class="num">AI ahead / behind</th></tr></thead><tbody>
    ${rows.slice().reverse().map((r) => `<tr><td>${r.date}</td><td class="num">${usd(r.agent)}</td><td class="num">${usd(r.spy)}</td><td class="num ${cls(r.agent - r.spy)}">${signedUsd(r.agent - r.spy)}</td></tr>`).join("")}
  </tbody></table>`;
}

function niceTicks(lo, hi, n) {
  const span = hi - lo, raw = span / n, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map((s) => s * mag).find((s) => span / s <= n) || 10 * mag;
  const out = [];
  for (let t = Math.ceil(lo / step) * step; t <= hi; t += step) out.push(t);
  return out;
}

function holdings(status) {
  const ps = status.positions || [];
  if (!ps.length) { $("holdings").innerHTML = `<div class="empty">Nothing yet.</div>`; return; }
  const cash = status.cash;
  const colors = ["var(--series-1)", "var(--series-2)", "var(--c3)", "var(--c4)", "var(--c5)", "var(--c6)", "var(--c7)", "var(--c8)"];
  const col = (i) => colors[i % colors.length];
  // Donut chart: one slice per holding (same colors as the table), plus cash in gray.
  const slices = ps.map((p, i) => ({ label: p.symbol, v: p.market_value, c: col(i) }));
  if (cash != null && cash >= 0.5) slices.push({ label: "Cash", v: cash, c: "var(--axis)" });
  const total = slices.reduce((a, x) => a + x.v, 0) || 1;
  const R = 70, r = 46, C = 80;
  let a0 = -Math.PI / 2;
  const arcs = slices.map((x) => {
    const a1 = a0 + (x.v / total) * Math.PI * 2 - 0.012;  // small gap between slices
    const big = a1 - a0 > Math.PI ? 1 : 0;
    const pt = (rad, a) => `${(C + rad * Math.cos(a)).toFixed(2)},${(C + rad * Math.sin(a)).toFixed(2)}`;
    const d = `M${pt(R, a0)}A${R},${R} 0 ${big} 1 ${pt(R, a1)}L${pt(r, a1)}A${r},${r} 0 ${big} 0 ${pt(r, a0)}Z`;
    a0 = a1 + 0.012;
    return `<path d="${d}" fill="${x.c}"><title>${esc(x.label)} ${(x.v / total * 100).toFixed(1)}% · ${usd(x.v)}</title></path>`;
  }).join("");
  const donut = `<svg class="donut" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Holdings split">${arcs}
    <text x="80" y="76" text-anchor="middle" font-size="11" fill="var(--ink-2)">Total</text>
    <text x="80" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)">${usd(total, 0)}</text></svg>`;
  $("holdings").innerHTML = `<div class="holdings-wrap">${donut}<table><thead><tr><th>ETF</th><th class="num">Share</th><th class="num">Value</th><th class="num">Gain $</th><th class="num">Gain %</th></tr></thead><tbody>
  ${ps.map((p, i) => `<tr><td><span class="dot" style="background:${col(i)}"></span><b>${esc(p.symbol)}</b> <span class="small">${esc(p.name || "")}</span></td><td class="num">${(p.weight * 100).toFixed(0)}%</td>
    <td class="num">${usd(p.market_value)}</td><td class="num ${cls(p.unrealized_pl)}">${signedUsd(p.unrealized_pl)}</td><td class="num ${cls(p.unrealized_pl)}">${pct((p.unrealized_plpc || 0) * 100)}</td></tr>`).join("")}
  ${cash != null && Math.abs(cash) >= 0.5 ? `<tr><td><span class="dot" style="background:var(--axis)"></span><b>Cash</b></td><td class="num">${(cash / status.equity * 100).toFixed(0)}%</td><td class="num">${usd(cash)}</td><td class="num">–</td><td class="num">–</td></tr>` : ""}
  </tbody></table></div>`;
}

function moodView(status, decisions) {

function exitReason(t, decisions) {
  // The sell that closed this trade: same ETF, on its close date.
  for (const d of decisions.slice().reverse()) {
    if (d.date !== t.closed_date) continue;
    const o = (d.orders || []).find((o) => o.symbol === t.symbol && o.side === "sell");
    if (!o) continue;
    if ((o.reason || "").startsWith("trailing stop")) return "🛑 Stop";
    return d.source === "watch" ? "⚡ Watcher" : d.source === "news" ? "📰 News Hunter" : "🧠 Claude's decision";
  }
  return "–";
}

const SOURCE_ICON = { claude: "🧠", watch: "⚡", news: "📰" };

const WHO_ICON = { claude: "🧠", watch: "⚡", news: "📰" };

function saleReason(r, decisions) {
  const idle = DATA.status.idle_asset || "SSO";
  for (const d of decisions) {
    const o = (d.orders || []).find((x) => x.order_id === r.order_id);
    if (!o) continue;
    const k = moveKind(d, o, idle);
    return (o.reason || "").startsWith("trailing stop") ? "🛑 Stop: dropped too far from its best price."
      : (k.reason || plainReason(d, o, idle));
  }
  return "";
}

function salesSummary(rows) {
  const won = rows.filter((r) => r.pnl > 0), lost = rows.filter((r) => r.pnl <= 0);
  const avg = (xs) => xs.length ? xs.reduce((t, r) => t + r.pnl_pct, 0) / xs.length : null;
  return { sales: rows.length, won: won.length, lost: lost.length, total_pnl: rows.reduce((t, r) => t + r.pnl, 0),
           win_rate: rows.length ? won.length / rows.length : 0, avg_win_pct: avg(won), avg_loss_pct: avg(lost) };
}

}

const NAMES = {};  // filled from holdings: symbol -> short description

function firstSentence(t, max = 110) {
  const f = (t || "").split(/(?<=[.!?])\s/)[0];
  return f.length > max ? f.slice(0, max - 1) + "…" : f;
}

function plainReason(d, o, idle) {
  const r = o.reason || "";
  const buys = (d.orders || []).filter((x) => x.side === "buy").map((x) => x.symbol);
  if (r.startsWith("trailing stop")) return `Sold to limit the loss: it dropped ${(r.match(/([\d.]+)% below/) || [])[1] || "6"}% from its best price.`;
  if (d.source === "news" && o.side === "buy") return r || "Breaking news that should push it up.";
  if (r.startsWith("funding")) return `Sold a little to pay for ${buys.join(" and ")}.`;
  if (d.source === "watch" && o.side === "buy") {
    const claude = r.split(" · Claude: ")[1];
    const n = (r.match(/^(\d)\/6/) || [])[1];
    return claude || `Rising strongly today with lots of buyers${n ? ` (${n} of 6 buy signals)` : ""}.`;
  }
  if (o.symbol === idle) return o.side === "buy" ? "Spare money goes to the S&P 500 ×2." : "Took money from the S&P 500 ×2 for stronger ideas.";
  if (o.side === "buy") {
    const p = (d.positions || []).find((x) => x.symbol === o.symbol);
    return p ? p.plain_reason || firstSentence(p.thesis) : "Claude expects it to beat the market.";
  }
  const e = (d.exits || []).find((x) => x.symbol === o.symbol);
  return e ? e.plain_reason : "Claude sees better places for this money.";
}

// A sell that leaves part of the position in Claude's plan is a "trim", not a full sale.
function moveKind(d, o, idle) {
  if (o.side === "buy") return { cls: "buy", label: "Buy" };
  const keep = (d.final_targets || {})[o.symbol];
  if (keep && o.symbol !== idle && !(o.reason || "").startsWith("trailing stop")) {
    const buys = (d.orders || []).filter((x) => x.side === "buy" && x.symbol !== idle).map((x) => x.symbol);
    const p = (d.positions || []).find((x) => x.symbol === o.symbol);
    const why = buys.length ? `to make room for ${buys.join(", ")}` : "to rebalance";
    return { cls: "trim", label: "Trim",
             reason: `Still holding it, just less: cut to ${Math.round(keep * 100)}% of the portfolio ${why}.` + (p && p.plain_reason ? ` ${p.plain_reason}` : "") };
  }
  return { cls: "sell", label: "Sell" };
}

function decisionsView(decisions) {
  const real = decisions.filter((d) => !d.dry_run && (d.market_view || d.error || (d.orders || []).length));
  if (!real.length) { $("decisions").innerHTML = `<div class="empty">Nothing yet.</div>`; return; }
  const idle = DATA.status.idle_asset || "SSO";
  const entry = (d) => {
    const who = d.source === "watch" ? `<span class="chip auto">⚡ watcher</span>`
      : d.source === "news" ? `<span class="chip news">📰 News Hunter</span>` : `<span class="chip">🧠 Claude</span>`;
    const orders = (d.orders || []).filter((o) => !["error", "skipped"].includes(o.status));
    let rows;
    if (d.error) rows = `<div class="move"><span class="tag sell">Error</span><span>Something went wrong, so nothing was traded.</span></div>`;
    else if (d.trade_today === false || !orders.length)
      rows = `<div class="move"><span class="tag hold">No changes</span><span>${esc(d.plain_summary || "Nothing worth changing today.")}</span></div>`;
    else rows = orders.map((o) => {
      const kind = moveKind(d, o, idle);
      return `<div class="move"><span class="tag ${kind.cls}">${kind.label} ${esc(o.symbol)} ${usd(o.notional, 0)}</span><span>${esc(kind.reason || plainReason(d, o, idle))}</span></div>`;
    }).join("");
    return `<div class="entry">
      <div><span class="when">${esc(d.date)}</span> <span class="small">${esc(d.time || "")}</span>${who}</div>
      <div class="moves">${rows}</div>
    </div>`;
  };
  // Today and yesterday stay on top; anything two or more days old goes under "Old daily logs".
  const nyDay = (offset) => new Date(Date.now() - offset * 864e5).toLocaleDateString("en-CA", { timeZone: "America/New_York" });
  const cutoff = nyDay(1);
  const newest = real.slice().reverse();
  const recent = newest.filter((d) => d.date >= cutoff), old = newest.filter((d) => d.date < cutoff).slice(0, 60);
  $("decisions").innerHTML = (recent.length ? recent.map(entry).join("") : `<div class="empty">No moves today or yesterday.</div>`)
    + (old.length ? `<details class="old-logs"><summary>Old daily logs (${old.length})</summary>${old.map(entry).join("")}</details>` : "");
  try {
    const card = $("log-card");
    if (localStorage.getItem("log-open") === "0") card.open = false;
    card.addEventListener("toggle", () => { try { localStorage.setItem("log-open", card.open ? "1" : "0"); } catch {} });
  } catch {}
}

// Live refresh: the watcher publishes live.json every minute on the "live" branch. The GitHub API
// serves it fresh but allows only 60 requests an hour per visitor; when that runs out (or fails),
// read the per-minute copy m-HHMM.json from a plain file link instead (new name every minute, so
// the 5-minute file cache never serves an old one).
const LIVE = "https://api.github.com/repos/diegodelossantosg/larp-trading/contents/live.json?ref=live";
const LIVE_RAW = "https://raw.githubusercontent.com/diegodelossantosg/larp-trading/live/";
let lastLive = 0, apiBlockedUntil = 0;
async function fetchLive() {
  if (Date.now() > apiBlockedUntil) {
    try {
      const r = await fetch(LIVE, { headers: { Accept: "application/vnd.github.raw" }, cache: "no-store" });
      if (r.ok) return await r.json();
      const reset = Number(r.headers.get("x-ratelimit-reset"));
      apiBlockedUntil = reset ? reset * 1000 : Date.now() + 10 * 60000;
    } catch {}
  }
  for (let back = 1; back <= 4; back++) {  // the newest minute that has surely been published
    const t = new Date(Date.now() - back * 60000);
    const name = `m-${String(t.getUTCHours()).padStart(2, "0")}${String(t.getUTCMinutes()).padStart(2, "0")}.json`;
    try { const r = await fetch(LIVE_RAW + name); if (r.ok) return await r.json(); } catch {}
  }
  return null;
}
async function refreshLive() {
  if (document.visibilityState !== "visible" || Date.now() - lastLive < 50000) return;
  lastLive = Date.now();
  try {
    const live = await fetchLive();
    if (!live) return;
    const st = live.status || {};
    if (st.updated && (!DATA.status.updated || new Date(st.updated) >= new Date(DATA.status.updated))) DATA.status = st;
    const pts = (DATA.intraday.points || []).slice();
    const seen = new Set(pts.map((p) => p[0]));
    for (const p of live.intraday_tail || []) if (!seen.has(p[0])) pts.push(p);
    DATA.intraday = { points: pts.sort((a, b) => a[0].localeCompare(b[0])) };
    hero(DATA.status, DATA.equity);
    holdings(DATA.status);
    renderChart();
  } catch {}
}
setInterval(refreshLive, 61000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refreshLive(); });
setTimeout(() => location.reload(), 15 * 60000);  // full reload now and then for everything else
(async () => {
  const [status, equity, decisions, trades, intraday, card, sales] = await Promise.all([load("status.json", {}), load("equity.json", []), load("decisions.json", []), load("scorecard.json", []), load("intraday.json", {}), load("report_card.json", null), load("sales.json", null)]);
  Object.assign(DATA, { status, equity, intraday });
  document.querySelectorAll("#intervals button").forEach((b) => b.addEventListener("click", () => {
    interval = b.dataset.iv;
    try { localStorage.setItem("interval", interval); } catch {}
    renderChart();
  }));
  if (status.mode === "LIVE") { $("mode").hidden = false; $("mode").textContent = "💵 Real money"; }
  hero(status, equity);
  renderChart();
  let lastW = $("chart").clientWidth;
  window.addEventListener("resize", () => { const w = $("chart").clientWidth; if (w !== lastW) { lastW = w; renderChart(); } });
  holdings(status);
  refreshLive();
  scorecardView(status);
  reportCardView(card);
  if (sales && sales.rows && sales.rows.length) closedFromSales(sales); else closedView(trades, decisions);
  soldView(sales, decisions);
  syncSoldHeight();
  if (window.ResizeObserver) new ResizeObserver(syncSoldHeight).observe($("holdings").closest(".card"));
  window.addEventListener("resize", syncSoldHeight);
  decisionsView(decisions);
  $("toggle-table").addEventListener("click", () => {
    const t = $("chart-table"); t.hidden = !t.hidden;
    $("toggle-table").textContent = t.hidden ? "Table" : "Chart only";
  });
})();
</script>
