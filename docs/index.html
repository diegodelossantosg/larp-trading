<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Trading Floor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
:root{--bg:#0b0a14;--ink:#f4ecd8;--dim:#a49cc0;--up:#6fd08c;--down:#ef6f6c;--gold:#f2c14e;--panel:rgba(14,12,28,.85);--line:#3a3556;
  --pixel:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
canvas{position:fixed;inset:0;width:100vw;height:100vh}
.hud{position:fixed;font-family:var(--pixel);font-size:13px;font-weight:600;line-height:1.5;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#tl{top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left))}
#tr{top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));text-align:right}
#bl{bottom:max(10px,env(safe-area-inset-bottom));left:max(10px,env(safe-area-inset-left));display:flex;gap:6px;align-items:center;padding:5px}
#card{bottom:max(10px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(440px,calc(100vw - 24px));font-size:13px;font-weight:500;padding:12px 14px}
#card h3{margin:0 0 6px;font-size:14px;font-weight:700}
#card p{margin:0}
.dim{color:var(--dim)} .up{color:var(--up)} .down{color:var(--down)}
button,select{font-family:var(--pixel);font-size:12px;font-weight:600;color:var(--ink);background:#221d38;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
button:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#heat{background:#0e0c1a;left:50%;top:50%;transform:translate(-50%,-50%);width:min(960px,calc(100vw - 24px));height:min(620px,calc(100vh - 24px));display:flex;flex-direction:column;gap:8px;padding:10px;box-sizing:border-box}
#heat[hidden]{display:none}
.heathead{display:flex;justify-content:space-between;align-items:center;font-size:14px}
#heatmap{position:relative;flex:1;min-height:0}
.cell{position:absolute;box-sizing:border-box;border:1px solid #0b0e14;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;overflow:hidden;text-align:center;color:#fff;font-family:var(--pixel)}
.cell span{font-size:14px;font-weight:800}.cell small{font-size:12px;opacity:.9;padding:0 4px;line-height:1.5}
.heatnote{margin:0;font-size:12px;font-weight:500}
#hint{left:50%;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 96px);transform:translateX(-50%);font-size:12px;white-space:nowrap;color:var(--dim)}
#tip{pointer-events:none;font-size:12px;padding:5px 9px;border-radius:8px;white-space:nowrap}
#panel{background:#0e0c1a;left:50%;top:50%;transform:translate(-50%,-50%);width:min(980px,calc(100vw - 24px));max-height:calc(100vh - 24px);display:flex;flex-direction:column;gap:10px;padding:12px 14px;box-sizing:border-box}
#panel[hidden]{display:none}
#pbody{overflow:auto;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.45;color:var(--ink);min-height:0}
#pbody table{width:100%;border-collapse:collapse}
#pbody th,#pbody td{padding:7px 8px;border-bottom:1px solid #2a2540;text-align:left;vertical-align:top}
#pbody th{color:var(--dim);font-weight:500;font-size:12px}
#pbody .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
#pbody .small{color:var(--dim);font-size:12px}
#pbody .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:4px 0 14px}
#pbody .tile{background:#1a1630;border:1px solid #2a2540;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
#pbody .tile b{font-size:17px}
#pbody .tag{display:inline-block;padding:1px 7px;border-radius:3px;font-size:12px;background:#2a2540;white-space:nowrap}
#pbody .tag.buy{background:#1e5a38}#pbody .tag.sell{background:#6a2a30}#pbody .tag.trim{background:#6a5a20}
#pbody .entry{padding:10px 0;border-bottom:1px solid #2a2540}
#pbody .move{display:flex;gap:10px;margin-top:6px;align-items:baseline}
#pbody details{margin-top:8px}#pbody summary{cursor:pointer;padding:6px 0;color:var(--gold)}
#pbody .versus{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;margin:8px 0 14px}
#pbody .side{background:#1a1630;border:1px solid #2a2540;padding:12px;display:flex;flex-direction:column;gap:4px}
#pbody .big{font-size:26px}#pbody .vs{text-align:center;max-width:180px}
#pbody .hold{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}#pbody .hold table{flex:1;min-width:300px}
#pbody .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
#pbody .bigchart{width:100%;height:auto;display:block;margin-top:6px}
#pbody .chartwrap{position:relative}
#pbody .ctip{position:absolute;pointer-events:none;background:#1a1630;border:1px solid #3a3556;border-radius:6px;padding:7px 10px;font-size:13px;line-height:1.5;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.45)}
#pbody .tile{border-radius:6px}#pbody .tile b{font-size:19px;font-variant-numeric:tabular-nums}
#pbody .trades{display:flex;flex-direction:column;gap:8px}
#pbody .trade{display:grid;grid-template-columns:minmax(150px,1.4fr) 0.8fr 0.8fr 1.2fr;gap:4px 14px;align-items:center;background:#16132a;border:1px solid #2a2540;border-left:4px solid #5a5470;border-radius:6px;padding:10px 14px}
#pbody .trade.won{border-left-color:#6fd08c}#pbody .trade.lost{border-left-color:#ef6f6c}
#pbody .t-what{display:flex;gap:10px;align-items:center}#pbody .t-what div{display:flex;flex-direction:column}
#pbody .t-icon{font-size:18px}#pbody .t-made{font-size:18px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
#pbody .t-pills{display:flex;gap:10px;align-items:center;justify-content:flex-end}
#pbody .pill{padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:#2a2540}#pbody .pill.up{background:rgba(111,208,140,.15)}#pbody .pill.down{background:rgba(239,111,108,.15)}
#pbody .t-why{grid-column:1/-1;color:var(--dim);font-size:13px;border-top:1px dashed #2a2540;padding-top:6px;margin-top:2px}
#pbody details summary{display:flex;justify-content:space-between;padding:8px 2px;margin-top:6px;border-bottom:1px solid #2a2540}
#pbody .paper{background:#f4ecd8;color:#2a2230;border-radius:4px;padding:22px 28px;font-family:Georgia,"Times New Roman",serif;max-width:720px;margin:0 auto;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#pbody .paper .mast{font-size:34px;font-weight:700;text-align:center;letter-spacing:.02em;border-bottom:3px double #2a2230;padding-bottom:6px}
#pbody .paper .dateline{display:flex;justify-content:space-between;font-size:12px;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid #2a2230;padding:5px 0;margin-bottom:14px}
#pbody .paper h2{font-size:23px;line-height:1.3;margin:0 0 12px;font-weight:700}
#pbody .paper .bought{font-family:system-ui,sans-serif;font-size:14px;margin:0 0 14px}
#pbody .paper .earlier{border-top:1px solid #2a2230;padding-top:10px;columns:2;column-gap:24px;font-size:14px}
#pbody .paper .earlier .label{column-span:all;font-family:system-ui,sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;color:#6a6070}
#pbody .paper .earlier p{margin:0 0 10px;break-inside:avoid}#pbody .paper .earlier span{display:block;font-family:system-ui,sans-serif;font-size:11px;color:#6a6070}
@media (max-width:640px){#pbody .trade{grid-template-columns:1fr 1fr}#pbody .paper .earlier{columns:1}}
@media (max-width:640px){#pbody .versus{grid-template-columns:1fr}#pbody{font-size:13px}}
#tl{cursor:pointer}
#toast{top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);max-width:min(560px,calc(100vw - 24px));font-size:9px;border-color:var(--gold)}
@media (max-width:640px){.hud{font-size:8px;padding:4px 6px}}
</style>
</head>
<body>
<canvas id="cv" width="1600" height="1000" aria-label="Pixel building where the three trading agents work"></canvas>
<div class="hud" id="tl">…</div>
<div class="hud" id="tr">…</div>
<div class="hud" id="bl">
  <button id="replay" title="Play back a past trading day">REPLAY</button>
  <select id="day" aria-label="Day to replay" hidden></select>
  <button id="speed" hidden>30×</button>
  <button id="heatbtn" aria-pressed="false">HEATMAP</button>
  <button id="soundbtn" aria-pressed="false">SOUND OFF</button>
  <button id="alertbtn" aria-pressed="false">ALERTS OFF</button>
</div>
<div class="hud" id="panel" hidden>
  <div class="heathead"><span id="ptitle"></span><span><span id="ptabs"></span> <button id="pclose" aria-label="Close">✕</button></span></div>
  <div id="pbody"></div>
</div>
<div class="hud" id="toast" hidden></div>
<div class="hud" id="tip" hidden></div>
<div class="hud" id="hint" hidden>Turn your phone sideways for a bigger view</div>
<div class="hud" id="card" hidden></div>
<div class="hud" id="heat" hidden>
  <div class="heathead"><span id="heattitle">YOUR HOLDINGS · COLOUR = TODAY</span><span><button id="heatday" aria-pressed="true">TODAY</button> <button id="heattot" aria-pressed="false">TOTAL</button> <button id="heatclose" aria-label="Close">✕</button></span></div>
  <div id="heatmap"></div>
  <p class="dim heatnote" id="heatnote">Size: money in each holding. TODAY shows today's move; TOTAL shows the move since it was bought.</p>
</div>

<script>
"use strict";
// ================================================================ data (same sources as the dashboard)
const RAW = "https://raw.githubusercontent.com/diegodelossantosg/larp-trading/main/docs/data/";
const LIVE = "https://api.github.com/repos/diegodelossantosg/larp-trading/contents/live.json?ref=live";
const LIVE_RAW = "https://raw.githubusercontent.com/diegodelossantosg/larp-trading/live/";
async function load(name, fallback) {
  for (const url of [`${RAW}${name}?t=${Date.now()}`, `data/${name}?t=${Date.now()}`]) {
    try { const r = await fetch(url, { cache: "no-store" }); if (r.ok) return await r.json(); } catch {}
  }
  return fallback;
}
let apiBlockedUntil = 0;
async function fetchLive() {
  if (Date.now() > apiBlockedUntil) {
    try {
      const r = await fetch(LIVE, { headers: { Accept: "application/vnd.github.raw" }, cache: "no-store" });
      if (r.ok) return await r.json();
      const reset = Number(r.headers.get("x-ratelimit-reset"));
      apiBlockedUntil = reset ? reset * 1000 : Date.now() + 10 * 60000;
    } catch {}
  }
  for (let back = 1; back <= 4; back++) {
    const t = new Date(Date.now() - back * 60000);
    const name = `m-${String(t.getUTCHours()).padStart(2, "0")}${String(t.getUTCMinutes()).padStart(2, "0")}.json`;
    try { const r = await fetch(LIVE_RAW + name); if (r.ok) return await r.json(); } catch {}
  }
  return null;
}

const $ = (id) => document.getElementById(id);
const D = { status: {}, decisions: [], intraday: { points: [] }, watch: {}, events: [], equity: [], sales: null };
const AG = ["claude", "watch", "news"];
const NAME = { claude: "CLAUDE", watch: "WATCHER", news: "NEWS HUNTER" };
const ROLE = { claude: "Researches every morning at 9:36 and sets the plan.", watch: "Checks every holding each minute and sells on a stop.", news: "Every hour, buys stocks that fell too hard on news." };
const COLOR = { claude: "#d9845a", watch: "#5aa9e6", news: "#b98be0" };

const NYF = new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23", weekday: "short" });
function ny(ms) {
  const p = Object.fromEntries(NYF.formatToParts(new Date(ms)).map((x) => [x.type, x.value]));
  return { date: `${p.year}-${p.month}-${p.day}`, min: +p.hour * 60 + +p.minute + +p.second / 60, wd: p.weekday };
}
const hhmm = (m) => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(Math.floor(m % 60)).padStart(2, "0")}`;
const money = (v) => "$" + Number(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = (v) => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(2) + "%";
const cls = (v) => (v > 0.005 ? "up" : v < -0.005 ? "down" : "");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function buildEvents() {
  D.events = D.decisions.filter((d) => d.date && d.time).map((d) => {
    const agent = d.source === "watch" ? "watch" : d.source === "news" ? "news" : "claude";
    const [h, m] = d.time.split(":").map(Number);
    const orders = (d.orders || []).filter((o) => o.symbol && o.side);
    const buys = orders.filter((o) => o.side === "buy").map((o) => o.symbol);
    const sells = orders.filter((o) => o.side === "sell").map((o) => o.symbol);
    const stopSells = orders.filter((o) => o.side === "sell" && /stop/i.test(o.reason || "")).map((o) => o.symbol);
    const full = orders.map((o) => `${o.side === "buy" ? "Bought" : "Sold"} ${o.symbol} ${money(o.notional)}`).join(", ");
    return { agent, date: d.date, min: h * 60 + m, orders, buys, sells, stopSells, full, summary: d.plain_summary || "" };
  }).sort((a, b) => a.date.localeCompare(b.date) || a.min - b.min);
}

// ================================================================ clock: live, or replaying a past day
const V = { mode: "live", day: null, min: 560, speed: 0.5, playing: false };
function now() {
  if (V.mode === "live") return ny(Date.now());
  const wd = new Date(V.day + "T12:00:00Z").toLocaleDateString("en-US", { weekday: "short", timeZone: "UTC" });
  return { date: V.day, min: V.min, wd };
}
const isWeekend = (t) => t.wd === "Sat" || t.wd === "Sun";
const isOpen = (t) => !isWeekend(t) && t.min >= 570 && t.min < 960;
const tradeWindow = () => (V.mode === "live" ? 8 : Math.max(5, 12 * V.speed));

// ================================================================ what each agent is doing right now
const hash = (s) => { let h = 7; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); };
const coffeeBreak = (id, t) => hash(id + t.date + Math.floor(t.min / 41)) % 5 === 0 && t.min % 41 < 3;
function lastEvent(id, t, today) {
  for (let i = D.events.length - 1; i >= 0; i--) {
    const e = D.events[i];
    if (e.agent !== id || e.date > t.date || (e.date === t.date && e.min > t.min)) continue;
    if (today && e.date !== t.date) return null;
    return e;
  }
  return null;
}
const short = (list) => list.slice(0, 3).join(", ") + (list.length > 3 ? "…" : "");
function watchLine() {
  const pos = (D.status.positions || []).filter((p) => p.current_price), highs = D.watch.highs || {};
  let worst = null;
  for (const p of pos) { const off = (p.current_price / Math.max(highs[p.symbol] || 0, p.current_price) - 1) * 100; if (!worst || off < worst.off) worst = { s: p.symbol, off }; }
  return worst && worst.off < -1 ? `${worst.s} ${worst.off.toFixed(1)}% from top` : "All holdings safe";
}
function plan(id, t) {
  const open = isOpen(t), today = lastEvent(id, t, true);
  const recent = today && t.min - today.min < tradeWindow() ? today : null;
  if (recent && recent.orders.length) {
    const stop = id === "watch" && recent.stopSells.length;
    const say = stop ? `Stop! Selling ${short(recent.stopSells)}` : recent.buys.length ? `Buying ${short(recent.buys)}!` : `Selling ${short(recent.sells)}`;
    return { spot: "term_" + id, act: "trade", say, loud: true, side: recent.buys.length ? "BUY" : "SELL", stop };
  }
  if (id === "claude") {
    if (!open) {
      if (!isWeekend(t) && t.min >= 540 && t.min < 570) return { spot: "coffee_claude", act: "stand", say: "Coffee first" };
      if (!isWeekend(t) && t.min >= 960 && t.min < 1020) return { spot: "desk", act: "read", say: "Writing today's diary" };
      return { spot: "bed_claude", act: "sleep" };
    }
    if (t.min < 576) return { spot: "coffee_claude", act: "stand", say: "Deciding at 9:36" };
    if (!today && t.min < 690) return { spot: "desk", act: "type", say: "Researching…", loud: true };
    if (coffeeBreak(id, t)) return { spot: "coffee_claude", act: "stand", say: "Coffee break" };
    return { spot: "desk", act: "read", say: today && today.buys.length ? `New picks: ${short(today.buys)}` : "Holding my picks" };
  }
  if (id === "watch") {
    if (!open) return t.min >= 960 && t.min < 1320 && !isWeekend(t) ? { spot: "arcade", act: "type", say: "Off duty!" } : { spot: "bed_watch", act: "sleep" };
    if (coffeeBreak(id, t)) return { spot: "coffee_watch", act: "stand", say: "Quick coffee" };
    return { spot: "console", act: "type", say: watchLine() };
  }
  if (!open) return !isWeekend(t) && t.min >= 960 && t.min < 1140 ? { spot: "armchair", act: "read", say: "Evening paper" } : { spot: "bed_news", act: "sleep" };
  const next = D.events.find((e) => e.agent === "news" && e.date === t.date && e.min >= t.min);
  const scanning = next ? next.min - t.min <= 5 : V.mode === "live" && t.min % 60 >= 15 && t.min % 60 < 21 && !(today && t.min - today.min < 40);
  if (scanning) return { spot: "teletype", act: "type", say: "Any big drops?", loud: true };
  if (coffeeBreak(id, t)) return { spot: "coffee_news", act: "stand", say: "Coffee break" };
  const nothing = today && !today.orders.length && t.min - today.min < 30;
  return { spot: "armchair", act: "read", say: nothing ? "Nothing worth buying" : "Reading the news" };
}

// ================================================================ drawing helpers (flat 2D: smooth shapes, real text)
const W = 800, H = 500;
const cv = document.getElementById("cv");
const main = cv.getContext("2d");
// The world is laid out in 800×500 units. The view widens or heightens to fill the window; VIEW.ex / VIEW.ey
// are the extra units on each side, filled with street, sky and neighbours.
const VIEW = { w: W, h: H, ex: 0, ey: 0, k: 2 };
let g = main;
const INK = "#2b2d42", FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
function mix(hex, f) {  // f > 0 lightens towards white, f < 0 darkens
  const c = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16)).map((v) => Math.round(f > 0 ? v + (255 - v) * f : v * (1 + f)));
  return "#" + c.map((v) => Math.max(0, Math.min(255, v)).toString(16).padStart(2, "0")).join("");
}
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function rr(x, y, w, h, r, fill, stroke, lw = 1.2) {
  g.beginPath(); g.roundRect(x, y, w, h, Math.min(r, w / 2, h / 2));
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); }
}
function circle(x, y, r, fill, stroke, lw = 1.2) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); if (fill) { g.fillStyle = fill; g.fill(); } if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); } }
function ellipse(x, y, rx, ry, rot, fill) { g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); g.fillStyle = fill; g.fill(); }
function poly(pts, fill) { g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath(); g.fillStyle = fill; g.fill(); }
function stroke(pts, color, lw = 1.2) { g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.strokeStyle = color; g.lineWidth = lw; g.lineJoin = g.lineCap = "round"; g.stroke(); }
function shadow(on, blur = 6, y = 2, a = 0.12) { g.shadowColor = on ? `rgba(30,35,60,${a})` : "transparent"; g.shadowBlur = on ? blur * VIEW.k : 0; g.shadowOffsetY = on ? y * VIEW.k : 0; }
function text(s, x, y, size, color, weight = 600, align = "left") { g.font = `${weight} ${size}px ${FONT}`; g.fillStyle = color; g.textAlign = align; g.textBaseline = "middle"; g.fillText(s, x, y); }
function textW(s, size, weight = 600) { g.font = `${weight} ${size}px ${FONT}`; return g.measureText(s).width; }
function line(x0, y0, x1, y1, c, w = 1) { stroke([[x0, y0], [x1, y1]], c, w); }
function glow(x, y, r, rgb, a) { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(${rgb},${a})`); gr.addColorStop(1, `rgba(${rgb},0)`); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); }

// ================================================================ characters: one round base, a detail each
// Standing: feet on y. Sitting: on a seat whose top is at y - 12, thighs along the seat, shins down to the floor.
const AC = { claude: "#e07a4a", watch: "#3f8fe0", news: "#8a5cc8" };
function figure(id, x, y, o = {}) {
  const dir = o.dir || 1, sit = o.pose === "sit", walk = o.walk || 0, eyes = o.eyes || "open";
  const seat = y - 12, bodyB = sit ? seat + 0.5 : y - 6 - (o.bob || 0), bodyT = bodyB - 14, hy = bodyT - 7.5;
  g.save();
  // legs
  if (sit) {
    rr(x - 2 * dir - (dir < 0 ? 12 : 0), seat - 4.5, 13, 5, 2.5, "#ffffff", INK, 1.3);            // thighs along the seat
    rr(x + 9 * dir - 2.5, seat - 1, 5, y - seat - 0.5, 2.5, "#ffffff", INK, 1.3);                  // shins down to the floor
    ellipse(x + 9 * dir + 1.5 * dir, y - 1, 3.6, 1.6, 0, INK);
  } else {
    const a = walk ? Math.sin(walk) * 2.2 : 0;
    for (const [dx, s] of [[-2.6, 1], [2.6, -1]]) { rr(x + dx - 2.3 + a * s * dir, y - 7.5, 4.6, 7, 2.3, "#ffffff", INK, 1.3); ellipse(x + dx + a * s * dir + dir, y - 0.8, 3, 1.4, 0, INK); }
  }
  rr(x - 7, bodyT, 14, 14, 5, "#ffffff", INK, 1.4);                                                 // body
  circle(x, hy, 9, "#ffffff", INK, 1.4);                                                            // head
  // eyes look the way the figure faces
  const ex = o.front ? 0 : 2.4 * dir;
  for (const dx of [-2.8, 2.8]) {
    if (eyes === "closed") stroke([[x + ex + dx - 1.4, hy + 1], [x + ex + dx, hy + 1.8], [x + ex + dx + 1.4, hy + 1]], INK, 1.1);
    else rr(x + ex + dx - 1, hy - 2.2, 2, 4, 1, INK);
  }
  accessory(id, x, hy, bodyT, dir, o.front);
  g.restore();
}
function accessory(id, x, hy, bodyT, dir, front) {
  if (id === "claude") {  // orange starburst on top, orange tie
    g.save(); g.translate(x, hy - 10.5); for (let k = 0; k < 8; k++) { g.rotate(Math.PI / 4); rr(-0.9, -4.6, 1.8, 4.6, 0.9, AC.claude); } g.restore();
    poly([[x, bodyT + 1.5], [x - 2, bodyT + 4], [x, bodyT + 10], [x + 2, bodyT + 4]], AC.claude);
  }
  if (id === "watch") {   // blue cap with the brim on the side it faces
    g.beginPath(); g.arc(x, hy - 2.5, 9.2, Math.PI, 0); g.closePath(); g.fillStyle = AC.watch; g.fill(); g.strokeStyle = INK; g.lineWidth = 1.2; g.stroke();
    if (front) rr(x - 7, hy - 3.5, 14, 2.6, 1.3, "#2a6bb0"); else rr(dir > 0 ? x + 4 : x - 13, hy - 3.6, 9, 2.6, 1.3, "#2a6bb0");
  }
  if (id === "news") {    // purple fedora with a press card
    rr(x - 11.5, hy - 9, 23, 3, 1.5, "#5e3a96"); rr(x - 6.5, hy - 16.5, 13, 8.5, 3, AC.news); rr(x - 6.5, hy - 11.2, 13, 2, 0.6, "#5e3a96");
    rr(x + 1.5, hy - 15.5, 4, 3.4, 0.6, "#ffffff");
  }
}
// lying in bed, head on the pillow: only the head shows above the blanket
function sleeper(id, x, y) {
  circle(x, y, 8.5, "#ffffff", INK, 1.4);
  for (const dx of [-2.6, 2.6]) stroke([[x + dx - 1.4, y - 0.5], [x + dx, y + 0.4], [x + dx + 1.4, y - 0.5]], INK, 1.1);
  if (id === "claude") { g.save(); g.translate(x - 10, y); for (let k = 0; k < 8; k++) { g.rotate(Math.PI / 4); rr(-0.8, -4, 1.6, 4, 0.8, AC.claude); } g.restore(); }
  if (id === "watch") { g.beginPath(); g.arc(x - 1, y, 9, Math.PI * 0.55, Math.PI * 1.45); g.closePath(); g.fillStyle = AC.watch; g.fill(); }
  if (id === "news") { rr(x - 12, y - 4, 4, 8, 1.5, AC.news); }
}

function skyOf(t) {
  const m = t.min;
  if (m < 360 || m >= 1230) return { k: "night", top: "#141a3a", bot: "#2b3566", city: "#232a4e", lit: 0.35 };
  if (m < 450) return { k: "dawn", top: "#7f8ccf", bot: "#f6c4a0", city: "#a596b8", lit: 0.12 };
  if (m >= 1110) return { k: "dusk", top: "#6a6fc0", bot: "#f3b28a", city: "#9a88b0", lit: 0.2 };
  return { k: "day", top: "#8ec2ef", bot: "#d9ecfa", city: "#bccbe0", lit: 0 };
}
// The market's mood (from status.health) sets the weather: healthy = clear, cautious = clouds,
// stressed = rain, 3+ stress points = storm.
function weatherOf() {
  const h = D.status.health || {}, sp = h.stress_points ?? 0;
  if (!h.mood || h.mood === "unknown") return "clear";
  return sp >= 3 ? "storm" : h.mood === "stressed" ? "rain" : h.mood === "cautious" ? "cloudy" : "clear";
}
const MOOD_TEXT = { clear: "HEALTHY", cloudy: "CAUTIOUS", rain: "STRESSED", storm: "VERY STRESSED" };
function skyFill(sky, wx, y0, y1) {
  const gr = g.createLinearGradient(0, y0, 0, y1);
  const dim = { clear: 0, cloudy: 0.15, rain: 0.35, storm: 0.5 }[wx];
  gr.addColorStop(0, mix(sky.top, -dim)); gr.addColorStop(1, mix(sky.bot, -dim * 0.8)); return gr;
}
function cloud(x, y, s, c) { for (const [dx, dy, r] of [[0, 0, 6], [7, -3, 7], [15, 0, 6], [8, 2, 6]]) circle(x + dx * s, y + dy * s, r * s, c); }

const WINDOWS = [];  // glass of every window, filled while drawing the background (rain falls in it)
function windowView(x, y, w, h, sky, o = {}) {
  shadow(true, 4, 1, 0.1); rr(x, y, w, h, 3, "#ffffff"); shadow(false);
  g.save(); g.beginPath(); g.roundRect(x + 3, y + 3, w - 6, h - 6, 2); g.clip();
  const wx = weatherOf(); g.fillStyle = skyFill(sky, wx, y, y + h); g.fillRect(x, y, w, h);
  g.fillStyle = sky.city; const r = rng(x * 3 + y);
  for (let bx = x + 3; bx < x + w - 3;) { const bw = 5 + r() * 8, bh = h * (0.25 + r() * 0.35); rr(bx, y + h - 3 - bh, bw, bh + 2, 1, sky.city); if (sky.lit) for (let wy = y + h - bh; wy < y + h - 5; wy += 4) if (r() < 0.5) R(bx + 2, wy, 1.5, 1.8, "#f6d77a"); bx += bw + 1.5; }
  if (wx !== "clear") { const cc = sky.k === "night" ? "#3a4066" : wx === "cloudy" ? "#ffffff" : "#aab2c4"; cloud(x + w * 0.25, y + h * 0.28, 0.45, cc); cloud(x + w * 0.62, y + h * 0.18, 0.4, cc); }

  R(x + w / 2 - 0.8, y + 2, 1.6, h - 4, "#ffffff"); R(x + 2, y + h / 2 - 0.8, w - 4, 1.6, "#ffffff");
  rr(x - 3, y + h - 1, w + 6, 4, 2, "#ffffff");
  if (o.blinds) { for (let k = 0; k < o.blinds; k++) rr(x + 3, y + 4 + k * 4, w - 6, 2.4, 1, "rgba(255,255,255,.9)"); }
  if (o.curtain) for (const cx of [x - 6, x + w - 2]) { rr(cx, y - 3, 8, h + 6, 3, o.curtain); rr(cx + 2, y - 3, 1.2, h + 6, 0.6, mix(o.curtain, -0.12)); }

function moveKind(d, o, idle) {

  const keep = (d.final_targets || {})[o.symbol];

    const buys = (d.orders || []).filter((x) => x.side === "buy" && x.symbol !== idle).map((x) => x.symbol), p = (d.positions || []).find((x) => x.symbol === o.symbol);
    return { cls: "trim", label: "Trim", reason: `Still holding it, just less: cut to ${Math.round(keep * 100)}% of the portfolio ${buys.length ? `to make room for ${buys.join(", ")}` : "to rebalance"}.` + (p && p.plain_reason ? ` ${p.plain_reason}` : "") };
  }
  return { cls: "sell", label: "Sell" };
}

function plainReason(d, o, idle) {
  const r = o.reason || "", buys = (d.orders || []).filter((x) => x.side === "buy").map((x) => x.symbol);
  if (r.startsWith("trailing stop")) return `Sold to limit the loss: it dropped ${(r.match(/([\d.]+)% below/) || [])[1] || "6"}% from its best price.`;
  if (d.source === "news" && o.side === "buy") return r || "Breaking news that should push it up.";
  if (r.startsWith("funding")) return `Sold a little to pay for ${buys.join(" and ")}.`;
  if (d.source === "watch" && o.side === "buy") { const c = r.split(" · Claude: ")[1], n = (r.match(/^(\d)\/6/) || [])[1]; return c || `Rising strongly today with lots of buyers${n ? ` (${n} of 6 buy signals)` : ""}.`; }
  if (o.symbol === idle) return o.side === "buy" ? "Spare money goes to the S&P 500 ×2." : "Took money from the S&P 500 ×2 for stronger ideas.";
  if (o.side === "buy") { const p = (d.positions || []).find((x) => x.symbol === o.symbol); return p ? p.plain_reason || firstSentence(p.thesis) : "Claude expects it to beat the market."; }

  const cells = squarify(heatItems(), 0, 0, W2, H2), sg = (v) => (v >= 0 ? "+" : "−");
  box.innerHTML = cells.map((c) => {
    const big = c.w > 120 && c.h > 110, mid = c.w > 70 && c.h > 60, colour = heatMode === "today" ? heatColor(c.today) : heatColor(c.total * 0.3);
    // the text follows the mode: today's move, or the move since it was bought
    const today = heatMode === "today", p = today ? c.today : c.total, d = today ? c.td : c.pl, when = today ? "today" : "total";
    const lines = [`<b style="font-size:${big ? 18 : mid ? 13 : 9}px">${esc(c.s)}</b>`];
    if (mid) lines.push(`<span>${sg(p)}${Math.abs(p).toFixed(2)}% ${when}</span>`);
    if (big) lines.push(`<small>${esc(c.name)}</small>`, `<small>${money(c.v)} · ${sg(d)}${money(Math.abs(d))} ${when}</small>`);
    return `<div class="cell" style="left:${c.x}px;top:${c.y}px;width:${c.w}px;height:${c.h}px;background:${colour}" title="${esc(c.name)}">${lines.join("")}</div>`;
  }).join("") || `<p class="dim" style="padding:20px">No holdings yet.</p>`;
  $("heattitle").textContent = `YOUR HOLDINGS · COLOUR = ${heatMode.toUpperCase()}`;
  $("heatday").setAttribute("aria-pressed", heatMode === "today"); $("heattot").setAttribute("aria-pressed", heatMode === "total");
}
function toggleHeat(show) { $("heat").hidden = !show; $("heatbtn").setAttribute("aria-pressed", show); if (show) heatPanel(); }
const hitAgent = (x, y) => AG.find((id) => { const a = agents[id]; return a && lift.rider !== a && x >= a.x - 2 && x <= a.x + 22 && y >= a.y - 31 && y <= a.y + 2; });
const toWorld = (e) => [e.clientX / innerWidth * VIEW.w - VIEW.ex, e.clientY / innerHeight * VIEW.h - VIEW.ey];
const onHeatScreen = (x, y) => x >= 218 && x <= 512 && y >= 236 && y <= 324;
const DOING = { type: "working", read: "reading", sleep: "asleep", trade: "trading", stand: "on a break" };
// things you can point at; each has a short label and, where useful, a click action
const SPOTS = [
  { r: [218, 236, 294, 88], label: () => "Holdings heatmap (today) · click to enlarge", click: () => toggleHeat(true) },
  { r: [288, 78, 206, 80], label: () => "Holdings: value, share and gains · click to open", click: () => panelHoldings() },
  { r: [28, 238, 184, 84], label: () => "AI vs S&P 500 · click for the full chart", click: () => panelChart() },
  { r: [500, 125, 30, 62], label: () => "Trades: closed trades and partial sales · click to open", click: () => panelTrades() },
  { r: [230, 150, 24, 14], label: () => "Claude's diary: the daily log · click to open", click: () => panelDiary() },

  { r: [662, 72, 52, 36], label: () => "News Hunter's latest note · click to read", click: () => newsCard() },
  { r: [26, 356, 98, 72], label: () => "Who's earning: all three agents vs the S&P · click to open", click: () => panelAgents() },
  { r: [-1e4, -1e4, 2e4, 1e4 + 44], label: () => `Market mood: ${MOOD_TEXT[weatherOf()].toLowerCase()} · click for the gauges`, click: () => panelMood() },
];
const spotAt = (x, y) => SPOTS.find(({ r }) => x >= r[0] && x <= r[0] + r[2] && y >= r[1] && y <= r[1] + r[3]);
function newsCard() {
  panelState = null; selected = null; $("card").hidden = true;
  const all = D.events.filter((v) => v.agent === "news"), e = all.at(-1);
  if (!e) return openPanel("NEWS HUNTER", `<p class="small">No news checks yet.</p>`);
  const day = new Date(e.date + "T12:00:00Z").toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });
  const earlier = all.filter((v) => v !== e).slice(-5).reverse();
  const bought = e.orders.filter((o) => o.side === "buy");
  openPanel("NEWS HUNTER", `<div class="paper">
    <div class="mast">The Daily Dip</div>
    <div class="dateline"><span>${day}</span><span>${hhmm(e.min)} New York</span></div>
    <h2>${esc(e.summary || e.full || "Checked the news.")}</h2>
    ${bought.length ? `<p class="bought">Bought: ${bought.map((o) => `<b>${esc(o.symbol)}</b> ${usd(o.notional)}`).join(" · ")}</p>` : `<p class="bought">No buy on this check.</p>`}
    ${earlier.length ? `<div class="earlier"><div class="label">Earlier checks</div>${earlier.map((v) => `<p><span>${esc(v.date.slice(5).replace("-", "/"))} ${hhmm(v.min)}</span>${esc(v.summary || v.full || "Nothing worth buying.")}</p>`).join("")}</div>` : ""}
  </div>`);
}
cv.addEventListener("click", (e) => {
  const [x, y] = toWorld(e);
  const hitA = hitAgent(x, y), sp = !hitA && spotAt(x, y);
  if (sp && sp.click) { sp.click(); return; }
  const hit = hitA;
  selected = hit && hit !== selected ? hit : null;
  if (selected) card(); else $("card").hidden = true;
});
let tipTimer = 0;
cv.addEventListener("pointermove", (e) => {
  if (e.pointerType !== "mouse") return;
  clearTimeout(tipTimer); tipTimer = setTimeout(() => { $("tip").hidden = true; }, 3500);
  const [x, y] = toWorld(e), a = hitAgent(x, y), sp = !a && spotAt(x, y), tip = $("tip");
  const text = a ? `${NAME[a]} · ${DOING[agents[a].plan.act] || "busy"} · click for details` : sp ? sp.label() : "";
  cv.style.cursor = a || (sp && sp.click) ? "pointer" : "default";
  tip.hidden = !text; if (!text) return;
  tip.textContent = text;
  tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + "px"; tip.style.top = Math.max(8, e.clientY - 30) + "px";
});
cv.addEventListener("mouseleave", () => { $("tip").hidden = true; });
$("heatbtn").onclick = () => toggleHeat($("heat").hidden);
$("heatclose").onclick = () => toggleHeat(false);
$("heatday").onclick = () => { heatMode = "today"; heatPanel(); };
$("heattot").onclick = () => { heatMode = "total"; heatPanel(); };
addEventListener("keydown", (e) => { if (e.key === "Escape") toggleHeat(false); });
function fit() {
  const a = innerWidth / innerHeight, vw = Math.max(W, H * a), vh = Math.max(H, W / a);
  Object.assign(VIEW, { w: vw, h: vh, ex: (vw - W) / 2, ey: (vh - H) / 2 });
  const k = Math.min(4, Math.max(2, (innerWidth * (devicePixelRatio || 1)) / vw));  // sharp on every screen
  VIEW.k = k;
  for (const c of [cv, bg]) { c.width = Math.round(vw * k); c.height = Math.round(vh * k); }
  main.setTransform(k, 0, 0, k, VIEW.ex * k, VIEW.ey * k);
  bgKey = ""; if (!$("heat").hidden) heatPanel();
  $("hint").hidden = !(innerHeight > innerWidth * 1.15 && innerWidth < 700);
}
addEventListener("resize", fit);

function tradingDays() { return [...new Set(D.events.map((e) => e.date))].slice(-15).reverse(); }
function setMode(mode) {
  V.mode = mode;
  $("replay").textContent = mode === "live" ? "REPLAY" : "● BACK TO LIVE"; $("replay").setAttribute("aria-pressed", mode === "replay");
  $("day").hidden = $("speed").hidden = mode === "live";
  think(true); bgKey = ""; lastHud = -1;
}
function startReplay(day) {
  const days = tradingDays();
  $("day").innerHTML = days.map((d) => `<option value="${d}">${d.slice(5)}</option>`).join("");
  V.day = day || days.find((d) => D.events.some((e) => e.date === d && e.orders.length)) || days[0];
  $("day").value = V.day; V.min = 560; V.playing = true;
  setMode("replay");
}
$("replay").onclick = () => (V.mode === "live" ? startReplay() : setMode("live"));
$("day").onchange = () => startReplay($("day").value);
$("speed").onclick = () => { V.speed = V.speed === 0.5 ? 2 : V.speed === 2 ? 0.1 : 0.5; $("speed").textContent = { 0.5: "30×", 2: "120×", 0.1: "6×" }[V.speed]; };

async function refreshAll() {
  const [status, decisions, intraday, watch, equity, sales] = await Promise.all([load("status.json", D.status), load("decisions.json", D.decisions), load("intraday.json", D.intraday), load("watch.json", D.watch), load("equity.json", D.equity), load("sales.json", D.sales)]);
  Object.assign(D, { status: status || {}, decisions: decisions || [], intraday: intraday && intraday.points ? intraday : { points: [] }, watch: watch || {}, equity: equity || [], sales });
  buildEvents(); checkNewTrades(); lastHud = -1;
}
async function refreshLive() {
  if (document.visibilityState !== "visible") return;
  const lv = await fetchLive();
  if (!lv) return;
  const st = lv.status || {};
  if (st.updated && (!D.status.updated || new Date(st.updated) >= new Date(D.status.updated))) D.status = st;
  const pts = (D.intraday.points || []).slice(), seen = new Set(pts.map((p) => p[0]));
  for (const p of lv.intraday_tail || []) if (!seen.has(p[0])) pts.push(p);
  D.intraday = { points: pts.sort((a, b) => a[0].localeCompare(b[0])) };
  lastHud = -1;
}
(async () => {
  fit(); paintButtons();
  await refreshAll();
  think(true);
  requestAnimationFrame((ts) => { lastTs = ts; frame(ts); });
  refreshLive();
  setInterval(refreshLive, 61000);
  setInterval(refreshAll, 3 * 60000);
})();
</script>
