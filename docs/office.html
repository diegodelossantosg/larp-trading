<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Trading Floor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{--bg:#0b0a14;--ink:#f4ecd8;--dim:#a49cc0;--up:#6fd08c;--down:#ef6f6c;--gold:#f2c14e;--panel:rgba(14,12,28,.85);--line:#3a3556;
  --pixel:"Press Start 2P",ui-monospace,monospace;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
canvas{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:pixelated;image-rendering:crisp-edges}
.hud{position:fixed;font-family:var(--pixel);font-size:10px;line-height:1.7;color:var(--ink);background:var(--panel);border:2px solid var(--line);padding:6px 10px;box-shadow:3px 3px 0 #000}
#tl{top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left))}
#tr{top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));text-align:right}
#bl{bottom:max(10px,env(safe-area-inset-bottom));left:max(10px,env(safe-area-inset-left));display:flex;gap:6px;align-items:center;padding:5px}
#card{bottom:max(10px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(440px,calc(100vw - 24px));font-size:9px;padding:10px 12px}
#card h3{margin:0 0 6px;font-size:10px;font-weight:normal}
#card p{margin:0}
.dim{color:var(--dim)} .up{color:var(--up)} .down{color:var(--down)}
button,select{font-family:var(--pixel);font-size:8px;color:var(--ink);background:#221d38;border:2px solid var(--line);padding:6px 8px;cursor:pointer}
button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
button:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#heat{background:#0e0c1a;left:50%;top:50%;transform:translate(-50%,-50%);width:min(960px,calc(100vw - 24px));height:min(620px,calc(100vh - 24px));display:flex;flex-direction:column;gap:8px;padding:10px;box-sizing:border-box}
#heat[hidden]{display:none}
.heathead{display:flex;justify-content:space-between;align-items:center;font-size:10px}
#heatmap{position:relative;flex:1;min-height:0}
.cell{position:absolute;box-sizing:border-box;border:1px solid #0b0e14;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;overflow:hidden;text-align:center;color:#fff;font-family:var(--pixel)}
.cell span{font-size:9px}.cell small{font-size:7px;opacity:.85;padding:0 4px}
.heatnote{margin:0;font-size:8px}
@media (max-width:640px){.hud{font-size:8px;padding:4px 6px}}
</style>
</head>
<body>
<canvas id="cv" width="1600" height="1000" aria-label="Pixel building where the three trading agents work"></canvas>
<div class="hud" id="tl">…</div>
<div class="hud" id="tr">…</div>
<div class="hud" id="bl">
  <button id="live" aria-pressed="true">LIVE</button>
  <button id="replay" aria-pressed="false">REPLAY</button>
  <select id="day" aria-label="Day to replay" hidden></select>
  <button id="speed" hidden>30×</button>
  <button id="heatbtn" aria-pressed="false">HEATMAP</button>
</div>
<div class="hud" id="card" hidden></div>
<div class="hud" id="heat" hidden>
  <div class="heathead"><span>YOUR HOLDINGS TODAY</span><button id="heatclose" aria-label="Close">✕</button></div>
  <div id="heatmap"></div>
  <p class="dim heatnote">Size: money in each holding. Colour: today's move.</p>
</div>

<script>
"use strict";
// ================================================================ data (same sources as the dashboard)
const RAW = "https://raw.githubusercontent.com/diegodelossantosg/larp-trading/main/docs/data/";
const LIVE = "https://api.github.com/repos/diegodelossantosg/larp-trading/contents/live.json?ref=live";
const LIVE_RAW = "https://raw.githubusercontent.com/diegodelossantosg/larp-trading/live/";
async function load(name, fallback) {
  for (const url of [`${RAW}${name}?t=${Date.now()}`, `data/${name}?t=${Date.now()}`]) {
    try { const r = await fetch(url, { cache: "no-store" }); if (r.ok) return await r.json(); } catch {}
  }
  return fallback;
}
let apiBlockedUntil = 0;
async function fetchLive() {
  if (Date.now() > apiBlockedUntil) {
    try {
      const r = await fetch(LIVE, { headers: { Accept: "application/vnd.github.raw" }, cache: "no-store" });
      if (r.ok) return await r.json();
      const reset = Number(r.headers.get("x-ratelimit-reset"));
      apiBlockedUntil = reset ? reset * 1000 : Date.now() + 10 * 60000;
    } catch {}
  }
  for (let back = 1; back <= 4; back++) {
    const t = new Date(Date.now() - back * 60000);
    const name = `m-${String(t.getUTCHours()).padStart(2, "0")}${String(t.getUTCMinutes()).padStart(2, "0")}.json`;
    try { const r = await fetch(LIVE_RAW + name); if (r.ok) return await r.json(); } catch {}
  }
  return null;
}

const D = { status: {}, decisions: [], intraday: { points: [] }, watch: {}, events: [] };
const AG = ["claude", "watch", "news"];
const NAME = { claude: "CLAUDE", watch: "WATCHER", news: "NEWS HUNTER" };
const ROLE = { claude: "Researches every morning at 9:36 and sets the plan.", watch: "Checks every holding each minute and sells on a stop.", news: "Every hour, buys stocks that fell too hard on news." };
const COLOR = { claude: "#d9845a", watch: "#5aa9e6", news: "#b98be0" };

const NYF = new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23", weekday: "short" });
function ny(ms) {
  const p = Object.fromEntries(NYF.formatToParts(new Date(ms)).map((x) => [x.type, x.value]));
  return { date: `${p.year}-${p.month}-${p.day}`, min: +p.hour * 60 + +p.minute + +p.second / 60, wd: p.weekday };
}
const hhmm = (m) => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(Math.floor(m % 60)).padStart(2, "0")}`;
const money = (v) => "$" + Number(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = (v) => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(2) + "%";
const cls = (v) => (v > 0.005 ? "up" : v < -0.005 ? "down" : "");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function buildEvents() {
  D.events = D.decisions.filter((d) => d.date && d.time).map((d) => {
    const agent = d.source === "watch" ? "watch" : d.source === "news" ? "news" : "claude";
    const [h, m] = d.time.split(":").map(Number);
    const orders = (d.orders || []).filter((o) => o.symbol && o.side);
    const buys = orders.filter((o) => o.side === "buy").map((o) => o.symbol);
    const sells = orders.filter((o) => o.side === "sell").map((o) => o.symbol);
    const stopSells = orders.filter((o) => o.side === "sell" && /stop/i.test(o.reason || "")).map((o) => o.symbol);
    const full = orders.map((o) => `${o.side === "buy" ? "Bought" : "Sold"} ${o.symbol} ${money(o.notional)}`).join(", ");
    return { agent, date: d.date, min: h * 60 + m, orders, buys, sells, stopSells, full, summary: d.plain_summary || "" };
  }).sort((a, b) => a.date.localeCompare(b.date) || a.min - b.min);
}

// ================================================================ clock: live, or replaying a past day
const V = { mode: "live", day: null, min: 560, speed: 0.5, playing: false };
function now() {
  if (V.mode === "live") return ny(Date.now());
  const wd = new Date(V.day + "T12:00:00Z").toLocaleDateString("en-US", { weekday: "short", timeZone: "UTC" });
  return { date: V.day, min: V.min, wd };
}
const isWeekend = (t) => t.wd === "Sat" || t.wd === "Sun";
const isOpen = (t) => !isWeekend(t) && t.min >= 570 && t.min < 960;
const tradeWindow = () => (V.mode === "live" ? 8 : Math.max(5, 12 * V.speed));

// ================================================================ what each agent is doing right now
const hash = (s) => { let h = 7; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); };
const coffeeBreak = (id, t) => hash(id + t.date + Math.floor(t.min / 41)) % 5 === 0 && t.min % 41 < 3;
function lastEvent(id, t, today) {
  for (let i = D.events.length - 1; i >= 0; i--) {
    const e = D.events[i];
    if (e.agent !== id || e.date > t.date || (e.date === t.date && e.min > t.min)) continue;
    if (today && e.date !== t.date) return null;
    return e;
  }
  return null;
}
const short = (list) => list.slice(0, 3).join(", ") + (list.length > 3 ? "…" : "");
function watchLine() {
  const pos = (D.status.positions || []).filter((p) => p.current_price), highs = D.watch.highs || {};
  let worst = null;
  for (const p of pos) { const off = (p.current_price / Math.max(highs[p.symbol] || 0, p.current_price) - 1) * 100; if (!worst || off < worst.off) worst = { s: p.symbol, off }; }
  return worst && worst.off < -1 ? `${worst.s} ${worst.off.toFixed(1)}% from top` : "All holdings safe";
}
function plan(id, t) {
  const open = isOpen(t), today = lastEvent(id, t, true);
  const recent = today && t.min - today.min < tradeWindow() ? today : null;
  if (recent && recent.orders.length) {
    const stop = id === "watch" && recent.stopSells.length;
    const say = stop ? `Stop! Selling ${short(recent.stopSells)}` : recent.buys.length ? `Buying ${short(recent.buys)}!` : `Selling ${short(recent.sells)}`;
    return { spot: "term_" + id, act: "trade", say, loud: true, side: recent.buys.length ? "BUY" : "SELL", stop };
  }
  if (id === "claude") {
    if (!open) {
      if (!isWeekend(t) && t.min >= 540 && t.min < 570) return { spot: "coffee_claude", act: "stand", say: "Coffee first" };
      if (!isWeekend(t) && t.min >= 960 && t.min < 1020) return { spot: "desk", act: "read", say: "Writing today's diary" };
      return { spot: "bed_claude", act: "sleep" };
    }
    if (t.min < 576) return { spot: "coffee_claude", act: "stand", say: "Deciding at 9:36" };
    if (!today && t.min < 690) return { spot: "desk", act: "type", say: "Researching…", loud: true };
    if (coffeeBreak(id, t)) return { spot: "coffee_claude", act: "stand", say: "Coffee break" };
    return { spot: "desk", act: "read", say: today && today.buys.length ? `New picks: ${short(today.buys)}` : "Holding my picks" };
  }
  if (id === "watch") {
    if (!open) return t.min >= 960 && t.min < 1320 && !isWeekend(t) ? { spot: "arcade", act: "type", say: "Off duty!" } : { spot: "bed_watch", act: "sleep" };
    if (coffeeBreak(id, t)) return { spot: "coffee_watch", act: "stand", say: "Quick coffee" };
    return { spot: "console", act: "type", say: watchLine() };
  }
  if (!open) return !isWeekend(t) && t.min >= 960 && t.min < 1140 ? { spot: "armchair", act: "read", say: "Evening paper" } : { spot: "bed_news", act: "sleep" };
  const next = D.events.find((e) => e.agent === "news" && e.date === t.date && e.min >= t.min);
  const scanning = next ? next.min - t.min <= 5 : V.mode === "live" && t.min % 60 >= 15 && t.min % 60 < 21 && !(today && t.min - today.min < 40);
  if (scanning) return { spot: "teletype", act: "type", say: "Any big drops?", loud: true };
  if (coffeeBreak(id, t)) return { spot: "coffee_news", act: "stand", say: "Coffee break" };
  const nothing = today && !today.orders.length && t.min - today.min < 30;
  return { spot: "armchair", act: "read", say: nothing ? "Nothing worth buying" : "Reading the news" };
}

// ================================================================ drawing helpers
const W = 800, H = 500;
const cv = document.getElementById("cv");
const main = cv.getContext("2d");
main.setTransform(2, 0, 0, 2, 0, 0);  // the world is laid out in 800×450 units; half a unit is one pixel
main.imageSmoothingEnabled = false;
let g = main;
const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x * 2) / 2, Math.round(y * 2) / 2, w, h); };
const OUT = "#1a1426";
const box = (x, y, w, h, fill, edge = OUT) => { R(x, y, w, h, edge); R(x + 1, y + 1, w - 2, h - 2, fill); };
function mix(hex, f) {  // f > 0 lightens towards white, f < 0 darkens
  const c = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16)).map((v) => Math.round(f > 0 ? v + (255 - v) * f : v * (1 + f)));
  return "#" + c.map((v) => Math.max(0, Math.min(255, v)).toString(16).padStart(2, "0")).join("");
}
// a shaded block: light top edge, dark bottom and right edge, outline
function block(x, y, w, h, c) { box(x, y, w, h, c); R(x + 1, y + 1, w - 2, 1, mix(c, 0.25)); R(x + 1, y + h - 2, w - 2, 1, mix(c, -0.25)); R(x + w - 2, y + 1, 1, h - 2, mix(c, -0.15)); }
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const F = {A:"010101111101101",B:"110101110101110",C:"011100100100011",D:"110101101101110",E:"111100110100111",F:"111100110100100",G:"011100101101011",H:"101101111101101",I:"111010010010111",J:"001001001101010",K:"101101110101101",L:"100100100100111",M:"101111111101101",N:"110101101101101",O:"010101101101010",P:"110101110100100",Q:"010101101110011",R:"110101110101101",S:"011100010001110",T:"111010010010010",U:"101101101101111",V:"101101101101010",W:"101101111111101",X:"101101010101101",Y:"101101010010010",Z:"111001010100111","&":"010101010101011","+":"000010111010000","-":"000000111000000","−":"000000111000000",".":"000000000000010",",":"000000000010100",":":"000010000010000","%":"101001010100101","!":"010010010000010","?":"110001010000010","$":"011110010011110","/":"001001010100100","(":"010100100100010",")":"010001001001010","'":"010010000000000","…":"000000000000101","0":"111101101101111","1":"010110010010111","2":"110001010100111","3":"110001010001110","4":"101101111001001","5":"111100110001110","6":"011100111101111","7":"111001010010010","8":"111101111101111","9":"111101111001110"," ":"000000000000000"};
function txt(s, x, y, c, k = 1) { for (const ch of String(s).toUpperCase()) { const f = F[ch] || F[" "]; for (let i = 0; i < 15; i++) if (f[i] === "1") R(x + (i % 3) * k, y + ((i / 3) | 0) * k, k, k, c); x += 4 * k; } }
const tw = (s, k = 1) => String(s).length * 4 * k - k;
function line(x0, y0, x1, y1, c, s = 1) { const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), s) / s; for (let i = 0; i <= n; i++) R(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n, s, s, c); }
function glow(x, y, r, rgb, a) { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(${rgb},${a})`); gr.addColorStop(1, `rgba(${rgb},0)`); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); }

// ================================================================ characters: one white base model, a detail per agent
// Drawn at 1 pixel = 2 world pixels. Base body is 10×16, placed at (2,3) inside a 14×19 canvas so hats fit.
const BASE_HEAD = ["..oooooo..", ".owwwwwwo.", "owwwwwwwwo", "owwwwwwwwo", "owwwwwwwwo", "owwwwwwwwo", "ogwwwwwwgo", ".oggggggo."];
const BODY = {
  stand: ["..oooooo..", "..oggggo..", "..owwwwo..", "..owwwwo..", "..owwwwo..", "..owwowo..", "..owgowo..", "..oooooo.."],
  walkA: ["..oooooo..", "..oggggo..", "..owwwwo..", "..owwwwo..", "..owwwwo..", "..owowwo..", "..ogowwo..", "..oooooo.."],
  sit: ["..oooooo..", "..oggggo..", "..owwwwo..", "..owwwwo..", "..oooooo.."],
};
const EYES = { right: [4, 7], left: [2, 5], front: [3, 6] };
const ACCENT = {
  claude: (put) => {  // orange starburst on top, orange tie
    put(6, 1, "c"); put(5, 0, "c"); put(7, 0, "c"); put(6, 0, "c"); put(6, 2, "c"); put(5, 2, "c"); put(7, 2, "c");
    put(6, 12, "c"); put(7, 12, "c"); put(6, 13, "C"); put(7, 13, "C"); put(6, 14, "c"); put(7, 14, "c");
  },
  watch: (put, dir) => {  // blue cap with a brim on the side it faces
    for (let x = 3; x <= 10; x++) { put(x, 2, "o"); put(x, 3, "b"); put(x, 4, "b"); }
    put(2, 3, "o"); put(11, 3, "o"); put(2, 4, "o"); put(11, 4, "o"); put(6, 3, "B"); put(7, 3, "B");
    const bx = dir === "left" ? [0, 1, 2] : dir === "right" ? [11, 12, 13] : [];
    for (const x of bx) { put(x, 5, "o"); put(x, 4, x === bx[1] ? "b" : "o"); }
    if (!bx.length) for (let x = 2; x <= 11; x++) put(x, 5, "B");
  },
  news: (put) => {  // purple fedora with a press card
    for (let x = 4; x <= 9; x++) { put(x, 0, "o"); put(x, 1, "p"); put(x, 2, "p"); }
    put(3, 1, "o"); put(10, 1, "o"); put(3, 2, "o"); put(10, 2, "o"); put(5, 1, "P");
    for (let x = 1; x <= 12; x++) { put(x, 3, "o"); put(x, 4, x === 1 || x === 12 ? "o" : "P"); }
    put(7, 2, "w"); put(8, 2, "w"); put(8, 1, "w");
  },
};
const SPAL = { o: "#141018", w: "#ffffff", g: "#c9c6d2", e: "#141018", c: "#e07a4a", C: "#b8582e", b: "#3f8fe0", B: "#2a6bb0", p: "#8a5cc8", P: "#5e3a96" };
const SPR = {};
function buildSprites() {
  for (const id of AG) {
    SPR[id] = {};
    for (const dir of ["right", "left", "front"]) for (const body of ["stand", "walkA", "sit"]) for (const closed of [false, true]) {
      const c = document.createElement("canvas"); c.width = 14; c.height = 19;
      const x = c.getContext("2d");
      const grid = Array.from({ length: 19 }, () => Array(14).fill("."));
      const rows = BASE_HEAD.concat(BODY[body]);
      // the head keeps its place; a sitting body is shorter, so the whole figure drops
      const oy = body === "sit" ? 3 + 3 : 3;
      rows.forEach((r, y) => [...r].forEach((k, xx) => { if (k !== ".") grid[oy + y][2 + xx] = k; }));
      const [e1, e2] = EYES[dir];
      for (const ex of [e1, e2]) {
        if (closed) { grid[oy + 4][2 + ex] = "e"; if (ex + 1 < 9) grid[oy + 4][2 + ex + (dir === "left" ? -1 : 1)] = "e"; }
        else { grid[oy + 3][2 + ex] = "e"; grid[oy + 4][2 + ex] = "e"; }
      }
      const put = (px, py, k) => { const yy = py + oy - 3; if (yy >= 0 && yy < 19 && px >= 0 && px < 14) grid[yy][px] = k; };
      ACCENT[id](put, dir);
      grid.forEach((r, y) => r.forEach((k, xx) => { if (k !== ".") { x.fillStyle = SPAL[k]; x.fillRect(xx, y, 1, 1); } }));
      SPR[id][`${dir}-${body}${closed ? "-z" : ""}`] = c;
    }
    const src = SPR[id]["front-stand-z"], ly = document.createElement("canvas"); ly.width = 19; ly.height = 14;
    const lx = ly.getContext("2d"); lx.translate(0, 14); lx.rotate(-Math.PI / 2); lx.drawImage(src, 0, 0);  // head to the left, on the pillow
    SPR[id].lying = ly;
  }
}

// ================================================================ the building: three floors and a lift
// Floor 0 is the top floor (the agents' own rooms), 1 the trading room, 2 the ground floor.
const FEET = [187, 331, 475];
// the lift: one door per floor at the right; agents wait at WAIT_X and stand at INSIDE_X in the cabin
const DOOR_L = 732, DOOR_R = 772, WAIT_X = 704, INSIDE_X = 742;
const BEDS = [414, 514, 614];  // left edge of each bed, in AG order
const SP = {
  desk: { f: 0, x: 150, dir: 1, seat: true }, console: { f: 0, x: 356, dir: 1 },
  armchair: { f: 0, x: 558, dir: 1, seat: true }, teletype: { f: 0, x: 648, dir: 1 },
  term_claude: { f: 1, x: 540, dir: 1 }, term_news: { f: 1, x: 590, dir: 1 }, term_watch: { f: 1, x: 640, dir: 1 },
  coffee_claude: { f: 2, x: 196, dir: 1 }, coffee_watch: { f: 2, x: 204, dir: 1 }, coffee_news: { f: 2, x: 212, dir: 1 },
  arcade: { f: 2, x: 308, dir: 1 },
  bed_claude: { f: 2, x: 438, dir: -1, bed: 414 }, bed_watch: { f: 2, x: 538, dir: -1, bed: 514 }, bed_news: { f: 2, x: 638, dir: -1, bed: 614 },
};

function skyOf(t) {
  const m = t.min;
  if (m < 360 || m >= 1230) return { k: "night", bands: ["#070a1c", "#0b1026", "#101633", "#151c40", "#1b2350", "#22295c"], city: "#0e0c1e", lit: 0.35 };
  if (m < 450) return { k: "dawn", bands: ["#2a2f6e", "#4b3f86", "#7a4f8f", "#b5658a", "#e48a7c", "#f6b383"], city: "#2a2140", lit: 0.12 };
  if (m >= 1110) return { k: "dusk", bands: ["#24306e", "#433f8a", "#7b4e92", "#c0628a", "#ec8a6e", "#f7b768"], city: "#251d3a", lit: 0.2 };
  return { k: "day", bands: ["#4a8fd8", "#5b9de0", "#6fabe6", "#86bbec", "#a0cbf0", "#bcdcf4"], city: "#5d6a92", lit: 0 };
}

// --- furniture helpers. Units are half a real pixel: 0.5 = one pixel on the 1600×900 canvas.

function heatColor(p) {

}

    const a0 = pts[0][1], s0 = pts[0][2], ai = pts.map((p) => (p[1] / a0 - 1) * 100), sp = pts.map((p) => (p[2] / s0 - 1) * 100);
    const lo = Math.min(...ai, ...sp, -0.3), hi = Math.max(...ai, ...sp, 0.3);
    const m0 = pts[0][0], span = Math.max(pts.at(-1)[0] - m0 + 20, 60);
    const px = (m) => 34 + 170 * (m - m0) / span, py = (v) => 284 - (v - lo) / (hi - lo) * 60;
    hl(32, py(0), 176, "#2a4a60");
    for (const [arr, col] of [[sp, "#ef6f6c"], [ai, "#6fd08c"]]) for (let i = 1; i < pts.length; i++) line(px(pts[i - 1][0]), py(arr[i - 1]), px(pts[i][0]), py(arr[i]), col, 1);
    const fa = ai.at(-1), fs = sp.at(-1), f = (v) => (v >= 0 ? "+" : "") + v.toFixed(1) + "%";
    txt("AI " + f(fa), 34, 211, fa >= fs ? "#6fd08c" : "#ef6f6c"); txt("S&P " + f(fs), 94, 211, "#c9c0d8");
  } else txt(open ? "LOADING" : "CLOSED", 106, 246, "#4a5568");
  drawHeatmap(221, 207, 288, 80, open || V.mode === "replay");
  const ring = trades.length && ((T / 6) | 0) % 2, bx = 527 + (ring ? 1 : 0);
  for (let y = 0; y < 9; y += 0.5) { const w = 4 + y * 1.1; R(bx - w / 2, 262 + y, w, 0.5, y < 1 ? "#f4d27a" : "#e0b04a"); } R(bx - 1, 260, 2, 2, "#8a6a2a"); hl(bx - 7, 271, 14, "#a07a2a");
  [560, 610, 660].forEach((kx, i) => {
    const id = ["claude", "news", "watch"][i], busy = trades.includes(id);
    R(kx + 2, 252, 20, 13, busy ? "#0f2418" : "#0b141c");
    if (busy) { const p = A[id].plan; if (((T / 10) | 0) % 2) txt(p.side, kx + 12 - tw(p.side) / 2, 256, p.side === "BUY" ? "#6fd08c" : "#ef6f6c"); if (night) glow(kx + 12, 258, 18, "111,208,140", 0.2); }
    else { hl(kx + 4, 255, 12, "#2f6b45"); hl(kx + 4, 258, 8, "#2f6b45"); hl(kx + 4, 261, 10, "#2f6b45"); }
  });
  for (const id of trades) { const kx = { claude: 560, news: 610, watch: 660 }[id]; for (let k = 0; k < 7; k++) { const ph = (T * 0.8 + k * 9) % 44; ob(kx + 3 + ((k * 5) % 18), 246 - ph, 2.5, 2.5, ph < 32 ? "#f2c14e" : "#b8923a", 0.5); } }

  g.restore();

  // Lounge: steam, arcade, ceiling fan
  g.save(); g.translate(0, 50);
  if (AG.some((id) => A[id].phase === "idle" && A[id].at === "coffee_" + id)) for (let k = 0; k < 4; k++) R(240 + k * 2, 376 - ((T / 9 + k * 3) % 10), 1, 2, "#ffffff");
  const playing = A.watch.phase === "idle" && A.watch.at === "arcade";
  R(334, 358, 24, 20, playing ? "#101028" : "#0b0b16");
  if (playing) { R(336 + ((T / 4) | 0) % 20, 366, 2, 2, "#6fd08c"); R(344, 360 + ((T / 9) | 0) % 14, 2, 2, "#ef6f6c"); hl(336, 375, 20, "#7fb8ff"); txt(String((T / 6 | 0) % 1000).padStart(3, "0"), 349, 359.5, "#f2c14e"); if (night) glow(346, 368, 22, "127,184,255", 0.2); }
  else if (((T / 60) | 0) % 2) txt("ZAP", 340, 365, "#3a2a5a");
  R(210, 296, 1, 25, OUT); ob(206, 320, 9, 3, "#5a3a24", 0.5);
  const fa = (T / 6) % Math.PI; for (const dx of [-1, 1]) R(210.5 + (dx < 0 ? -18 * Math.abs(Math.cos(fa)) : 0), 322, 18 * Math.abs(Math.cos(fa)), 1, "#8a5a36");
  g.restore();

  // beds: pillow always, blanket on empty beds (a sleeper gets theirs drawn over them)
  BEDS.forEach((bx, i) => {
    ob(bx + 7, 451, 14, 6, "#ffffff", 0.5); hl(bx + 8, 455, 12, "#d8d4e0");
    const a = agents[AG[i]];
    if (!(a.phase === "idle" && a.at === "bed_" + AG[i])) blanket(bx, COLOR[AG[i]], true);
  });
}
function blanket(bx, col, made) {
  const x = made ? bx + 24 : bx + 19, w = made ? 43 : 48, y = made ? 452 : 448;
  ob(x, y, w, 461 - y, col, 0.5); R(x + 0.5, y + 0.5, 3, 461 - y - 1, mix(col, 0.2)); R(x + 0.5, y + 0.5, w - 1, 2, mix(col, 0.35)); for (let k = x + 6; k < x + w - 2; k += 8) vl(k, y + 3, 458 - y, mix(col, -0.15));
}
function clock(x, y, t) {
  for (let yy = -11; yy <= 11; yy++) for (let xx = -11; xx <= 11; xx++) { const d = xx * xx + yy * yy; if (d <= 121) R(x + xx, y + yy, 1, 1, d > 90 ? OUT : "#ffffff"); }
  const ha = ((t.min / 60) % 12) / 12 * Math.PI * 2 - Math.PI / 2, ma = (t.min % 60) / 60 * Math.PI * 2 - Math.PI / 2;
  line(x, y, x + Math.cos(ha) * 5, y + Math.sin(ha) * 5, OUT); line(x, y, x + Math.cos(ma) * 8, y + Math.sin(ma) * 8, "#e05a4a");
  txt("NY", x - 3, y + 14, OUT);
}
function drawTicker(s, x, y, hs) {
  let cx = x;
  for (const part of s.split("   ")) {
    const h = hs.find((q) => part.startsWith(q.s + " "));
    const col = h ? (h.today >= 0 ? "#6fd08c" : "#ef6f6c") : "#f2c14e";
    if (cx < 712 && cx + tw(part, 2) > 28) txt(part, cx, y, col, 2);
    cx += tw(part, 2) + 26;
  }
}

// ================================================================ speech bubbles and sleep Zs
function bubble(a, text) {
  const words = text.toUpperCase().split(" "), lines = [""];
  for (const w of words) { if ((lines.at(-1) + " " + w).trim().length > 18) lines.push(w); else lines[lines.length - 1] = (lines.at(-1) + " " + w).trim(); }
  const bw = Math.max(...lines.map((l) => tw(l))) + 8, bh = lines.length * 7 + 5;
  const cx = Math.round(a.x + 10);
  const bx = Math.round(Math.min(Math.max(cx - bw / 2, 14), W - 14 - bw)), by = Math.round(a.y - 36 - bh);
  R(bx - 1, by, bw + 2, bh, OUT); R(bx, by - 1, bw, bh + 2, OUT); R(bx, by, bw, bh, "#ffffff");
  R(cx - 1, by + bh, 3, 1, "#ffffff"); R(cx - 2, by + bh, 1, 2, OUT); R(cx + 2, by + bh, 1, 2, OUT); R(cx - 1, by + bh + 1, 3, 1, OUT); R(cx, by + bh + 1, 1, 1, "#ffffff"); R(cx, by + bh + 2, 1, 1, OUT);
  const col = { claude: "#b8582e", watch: "#2a6bb0", news: "#5e3a96" }[a.id];
  lines.forEach((l, i) => txt(l, bx + 4, by + 3 + i * 7, i === 0 ? col : OUT));
}
let selected = null;
function overlays() {
  AG.forEach((id, i) => {
    const a = agents[id];
    if (lift.rider === a) return;
    if (a.plan.act === "sleep" && a.phase === "idle") { const z = ((T / 30) | 0) % 3; txt("Z", a.x + 14 + z * 2, a.y - 31 - z * 4, "#e8e4ff"); if (z) txt("Z", a.x + 18, a.y - 38 - z * 2, "#a49cc0"); return; }
    if (!a.plan.say || a.phase !== "idle") return;
    const cycle = (T / 60 + i * 6) % 18;
    if (a.plan.loud || selected === id || cycle < 5) bubble(a, a.plan.say);
  });
  if (selected) { const a = agents[selected]; if (lift.rider !== a) { const b = ((T / 15) | 0) % 2; R(a.x + 3, a.y + 0.5 + b * 0.5, 14, 1, "#f2c14e"); } }
}

// ================================================================ main loop
let lastThink = 0, lastTs = 0, lastHud = -1;
function frame(ts) {
  const dt = Math.min(0.25, (ts - lastTs) / 1000 || 0); lastTs = ts; T++;
  if (V.mode === "replay" && V.playing) { V.min += dt * V.speed; if (V.min >= 975) { V.min = 975; V.playing = false; } }
  if (ts - lastThink > 400) { think(false); lastThink = ts; }
  const t = now();
  const sk = skyOf(t).k;
  if (sk !== bgKey) { drawBackground(t); bgKey = sk; }
  for (const id of AG) stepAgent(agents[id]);
  stepLift();
  main.drawImage(bg, 0, 0, W, H);
  live(t);
  for (const id of AG) if (lift.rider !== agents[id]) drawAgent(agents[id]);
  drawLift();
  overlays();
  const tick = Math.floor(t.min * 4);
  if (tick !== lastHud) { lastHud = tick; hud(t); }
  requestAnimationFrame(frame);
}

function drawAgent(a) {  // sprites are 14×19, drawn at 1.5 units (3 pixels) per sprite pixel
  const s = SP[a.at];
  if (a.phase === "idle" && s && s.bed != null) { main.drawImage(SPR[a.id].lying, s.bed + 3, 441.5, 28.5, 21); blanket(s.bed, COLOR[a.id], false); return; }
  const f = frameOf(a);
  main.drawImage(SPR[a.id][f.key], Math.round((a.x - 0.5) * 2) / 2, Math.round((a.y - 28.5 + f.bob * 0.75) * 2) / 2, 21, 28.5);
}
function drawLift() {
  const L = lift;
  FEET.forEach((fy, f) => {
    const top = fy - 50, here = L.floor === f && L.state !== "moving", open = here ? L.door : 0;
    if (open > 0) {  // the lit cabin behind the doors
      R(DOOR_L, top, 40, 51, "#efe2c4"); for (let x = DOOR_L + 4; x < DOOR_R; x += 8) R(x, top + 4, 1, 40, "#e0d0ae");
      R(DOOR_L, top, 40, 3, "#fff1b0"); R(DOOR_L + 2, fy - 24, 36, 2, "#c9a64a"); R(DOOR_L, fy - 3, 40, 4, "#9a8a76");
    } else R(DOOR_L, top, 40, 51, "#2a2438");
    const a = L.rider;
    if (a && a.floor === f && here && (open > 0 || a.phase === "out")) drawAgent(a);
    const pw = Math.round(20 * (1 - open));  // two panels sliding apart from the middle
    if (pw > 0) {
      R(DOOR_L, top, pw, 51, "#a8b0c0"); R(DOOR_R - pw, top, pw, 51, "#a8b0c0");
      R(DOOR_L + pw - 1, top, 1, 51, "#6a7286"); R(DOOR_R - pw, top, 1, 51, "#6a7286");
      R(DOOR_L, top, pw, 2, "#c8d0de"); R(DOOR_R - pw, top, pw, 2, "#c8d0de");
    }
    // floor display: where the cabin is, and which way it is going
    ob(740, top - 18, 24, 12, "#16131f");
    const shown = 3 - Math.round(L.pos), col = L.state === "moving" ? "#f2c14e" : "#6fd08c";
    txt(String(shown), 753, top - 15, col);
    if (L.state === "moving") { const up = L.target < L.pos; R(745, top - 13 + (up ? 0 : 1), 3, 1, col); R(746, top - 14 + (up ? 0 : 3), 1, 1, col); R(746, top - 12 + (up ? 0 : -1), 1, 1, col); }
    // call button: lights up while someone waits on this floor
    const calling = L.queue.some((q) => q.floor === f);
    ob(722, fy - 32, 8, 10, "#6a6476"); R(724, fy - 30, 4, 4, calling ? "#f2c14e" : "#3a3448");
  });
}

// ================================================================ HUD, agent card, big heatmap
const $ = (id) => document.getElementById(id);
function hud(t) {
  const s = D.status, p = s.performance || {};
  $("tl").innerHTML = s.equity == null ? "WAITING FOR DATA" :
    `${money(s.equity)}<br><span class="${cls(p.agent_return_pct)}">AI ${pct(p.agent_return_pct || 0)}</span> <span class="dim">VS</span> <span class="${cls(p.spy_return_pct)}">S&amp;P ${pct(p.spy_return_pct || 0)}</span>`;
  $("tr").innerHTML = `${V.mode === "replay" ? `<span class="dim">${esc(t.date.slice(5))}</span> ` : ""}NY ${hhmm(t.min)}<br><span class="${isOpen(t) ? "up" : "down"}">${isOpen(t) ? "● OPEN" : "● CLOSED"}</span>`;
  if (selected) card();
  if (!$("heat").hidden) heatPanel();
}
function card() {
  const id = selected, s = (D.status.scorecard || {})[id] || {};
  const last = [...D.events].reverse().find((e) => e.agent === id && e.orders.length);
  $("card").hidden = false;
  $("card").innerHTML = `<h3 style="color:${COLOR[id]}">${NAME[id]}</h3>
    <p class="dim">${ROLE[id]}</p>
    <p style="margin-top:6px">${s.buys ? `Beat S&amp;P on ${s.beat_spy}/${s.buys} buys · avg <span class="${cls(s.avg_vs_spy_pct)}">${pct(s.avg_vs_spy_pct)}</span>` : "No buys yet"}</p>
    ${last ? `<p class="dim" style="margin-top:6px">${esc(last.date.slice(5))}: ${esc(last.full)}</p>` : ""}`;
}
function heatPanel() {
  const box = $("heatmap"), W2 = box.clientWidth, H2 = box.clientHeight;
  const cells = squarify(heatItems(), 0, 0, W2, H2);
  box.innerHTML = cells.map((c) => {
    const big = c.w > 110 && c.h > 70, mid = c.w > 60 && c.h > 40;
    return `<div class="cell" style="left:${c.x}px;top:${c.y}px;width:${c.w}px;height:${c.h}px;background:${heatColor(c.today)}" title="${esc(c.name)}">
      <b style="font-size:${big ? 18 : mid ? 12 : 8}px">${esc(c.s)}</b>
      ${mid ? `<span>${c.today >= 0 ? "+" : ""}${c.today.toFixed(2)}%</span>` : ""}
      ${big ? `<small>${esc(c.name)} · ${money(c.v)} · total ${c.total >= 0 ? "+" : ""}${c.total.toFixed(1)}%</small>` : ""}</div>`;
  }).join("") || `<p class="dim" style="padding:20px">No holdings yet.</p>`;
}
function toggleHeat(show) { $("heat").hidden = !show; $("heatbtn").setAttribute("aria-pressed", show); if (show) heatPanel(); }
const hitAgent = (x, y) => AG.find((id) => { const a = agents[id]; return a && lift.rider !== a && x >= a.x - 2 && x <= a.x + 22 && y >= a.y - 31 && y <= a.y + 2; });
const toWorld = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; };
const onHeatScreen = (x, y) => x >= 220 && x <= 510 && y >= 238 && y <= 322;
cv.addEventListener("click", (e) => {
  const [x, y] = toWorld(e);
  if (onHeatScreen(x, y)) { toggleHeat(true); return; }
  const hit = hitAgent(x, y);
  selected = hit && hit !== selected ? hit : null;
  if (selected) card(); else $("card").hidden = true;
});
cv.addEventListener("mousemove", (e) => { const [x, y] = toWorld(e); cv.style.cursor = hitAgent(x, y) || onHeatScreen(x, y) ? "pointer" : "default"; });
$("heatbtn").onclick = () => toggleHeat($("heat").hidden);
$("heatclose").onclick = () => toggleHeat(false);
addEventListener("keydown", (e) => { if (e.key === "Escape") toggleHeat(false); });
function fit() { const s = Math.min(innerWidth / W, innerHeight / H); cv.style.width = Math.floor(W * s) + "px"; cv.style.height = Math.floor(H * s) + "px"; if (!$("heat").hidden) heatPanel(); }
addEventListener("resize", fit);

function tradingDays() { return [...new Set(D.events.map((e) => e.date))].slice(-15).reverse(); }
function setMode(mode) {
  V.mode = mode;
  $("live").setAttribute("aria-pressed", mode === "live"); $("replay").setAttribute("aria-pressed", mode === "replay");
  $("day").hidden = $("speed").hidden = mode === "live";
  think(true); bgKey = ""; lastHud = -1;
}
function startReplay(day) {
  const days = tradingDays();
  $("day").innerHTML = days.map((d) => `<option value="${d}">${d.slice(5)}</option>`).join("");
  V.day = day || days.find((d) => D.events.some((e) => e.date === d && e.orders.length)) || days[0];
  $("day").value = V.day; V.min = 560; V.playing = true;
  setMode("replay");
}
$("live").onclick = () => setMode("live");
$("replay").onclick = () => startReplay();
$("day").onchange = () => startReplay($("day").value);
$("speed").onclick = () => { V.speed = V.speed === 0.5 ? 2 : V.speed === 2 ? 0.1 : 0.5; $("speed").textContent = { 0.5: "30×", 2: "120×", 0.1: "6×" }[V.speed]; };

async function refreshAll() {
  const [status, decisions, intraday, watch] = await Promise.all([load("status.json", D.status), load("decisions.json", D.decisions), load("intraday.json", D.intraday), load("watch.json", D.watch)]);
  Object.assign(D, { status: status || {}, decisions: decisions || [], intraday: intraday && intraday.points ? intraday : { points: [] }, watch: watch || {} });
  buildEvents(); lastHud = -1;
}
async function refreshLive() {
  if (document.visibilityState !== "visible") return;
  const lv = await fetchLive();
  if (!lv) return;
  const st = lv.status || {};
  if (st.updated && (!D.status.updated || new Date(st.updated) >= new Date(D.status.updated))) D.status = st;
  const pts = (D.intraday.points || []).slice(), seen = new Set(pts.map((p) => p[0]));
  for (const p of lv.intraday_tail || []) if (!seen.has(p[0])) pts.push(p);
  D.intraday = { points: pts.sort((a, b) => a[0].localeCompare(b[0])) };
  lastHud = -1;
}
(async () => {
  fit(); buildSprites();
  await refreshAll();
  think(true);
  requestAnimationFrame((ts) => { lastTs = ts; frame(ts); });
  refreshLive();
  setInterval(refreshLive, 61000);
  setInterval(refreshAll, 3 * 60000);
})();
</script>
