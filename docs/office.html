<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Trading Floor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{--bg:#0b0a14;--ink:#f4ecd8;--dim:#a49cc0;--up:#6fd08c;--down:#ef6f6c;--gold:#f2c14e;--panel:rgba(14,12,28,.85);--line:#3a3556;
  --pixel:"Press Start 2P",ui-monospace,monospace;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
canvas{position:fixed;inset:0;width:100vw;height:100vh;image-rendering:pixelated;image-rendering:crisp-edges}
.hud{position:fixed;font-family:var(--pixel);font-size:10px;line-height:1.7;color:var(--ink);background:var(--panel);border:2px solid var(--line);padding:6px 10px;box-shadow:3px 3px 0 #000}
#tl{top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left))}
#tr{top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));text-align:right}
#bl{bottom:max(10px,env(safe-area-inset-bottom));left:max(10px,env(safe-area-inset-left));display:flex;gap:6px;align-items:center;padding:5px}
#card{bottom:max(10px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(440px,calc(100vw - 24px));font-size:9px;padding:10px 12px}
#card h3{margin:0 0 6px;font-size:10px;font-weight:normal}
#card p{margin:0}
.dim{color:var(--dim)} .up{color:var(--up)} .down{color:var(--down)}
button,select{font-family:var(--pixel);font-size:8px;color:var(--ink);background:#221d38;border:2px solid var(--line);padding:6px 8px;cursor:pointer}
button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
button:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#heat{background:#0e0c1a;left:50%;top:50%;transform:translate(-50%,-50%);width:min(960px,calc(100vw - 24px));height:min(620px,calc(100vh - 24px));display:flex;flex-direction:column;gap:8px;padding:10px;box-sizing:border-box}
#heat[hidden]{display:none}
.heathead{display:flex;justify-content:space-between;align-items:center;font-size:10px}
#heatmap{position:relative;flex:1;min-height:0}
.cell{position:absolute;box-sizing:border-box;border:1px solid #0b0e14;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;overflow:hidden;text-align:center;color:#fff;font-family:var(--pixel)}
.cell span{font-size:9px}.cell small{font-size:8px;opacity:.9;padding:0 4px;line-height:1.5}
.heatnote{margin:0;font-size:8px}
#hint{left:50%;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 96px);transform:translateX(-50%);font-size:8px;white-space:nowrap;color:var(--dim)}
#tip{pointer-events:none;font-size:8px;padding:4px 7px;box-shadow:2px 2px 0 #000;white-space:nowrap}
#toast{top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);max-width:min(560px,calc(100vw - 24px));font-size:9px;border-color:var(--gold)}
@media (max-width:640px){.hud{font-size:8px;padding:4px 6px}}
</style>
</head>
<body>
<canvas id="cv" width="1600" height="1000" aria-label="Pixel building where the three trading agents work"></canvas>
<div class="hud" id="tl">…</div>
<div class="hud" id="tr">…</div>
<div class="hud" id="bl">
  <button id="replay" title="Play back a past trading day">REPLAY</button>
  <select id="day" aria-label="Day to replay" hidden></select>
  <button id="speed" hidden>30×</button>
  <button id="heatbtn" aria-pressed="false">HEATMAP</button>
  <button id="soundbtn" aria-pressed="false">SOUND OFF</button>
  <button id="alertbtn" aria-pressed="false">ALERTS OFF</button>
</div>
<div class="hud" id="toast" hidden></div>
<div class="hud" id="tip" hidden></div>
<div class="hud" id="hint" hidden>Turn your phone sideways for a bigger view</div>
<div class="hud" id="card" hidden></div>
<div class="hud" id="heat" hidden>
  <div class="heathead"><span id="heattitle">YOUR HOLDINGS · COLOUR = TODAY</span><span><button id="heatday" aria-pressed="true">TODAY</button> <button id="heattot" aria-pressed="false">TOTAL</button> <button id="heatclose" aria-label="Close">✕</button></span></div>
  <div id="heatmap"></div>
  <p class="dim heatnote" id="heatnote">Size: money in each holding. Colour: today's move (switch to TOTAL for the move since you bought it).</p>
</div>

<script>
"use strict";
// ================================================================ data (same sources as the dashboard)
const RAW = "https://raw.githubusercontent.com/diegodelossantosg/larp-trading/main/docs/data/";
const LIVE = "https://api.github.com/repos/diegodelossantosg/larp-trading/contents/live.json?ref=live";
const LIVE_RAW = "https://raw.githubusercontent.com/diegodelossantosg/larp-trading/live/";
async function load(name, fallback) {
  for (const url of [`${RAW}${name}?t=${Date.now()}`, `data/${name}?t=${Date.now()}`]) {
    try { const r = await fetch(url, { cache: "no-store" }); if (r.ok) return await r.json(); } catch {}
  }
  return fallback;
}
let apiBlockedUntil = 0;
async function fetchLive() {
  if (Date.now() > apiBlockedUntil) {
    try {
      const r = await fetch(LIVE, { headers: { Accept: "application/vnd.github.raw" }, cache: "no-store" });
      if (r.ok) return await r.json();
      const reset = Number(r.headers.get("x-ratelimit-reset"));
      apiBlockedUntil = reset ? reset * 1000 : Date.now() + 10 * 60000;
    } catch {}
  }
  for (let back = 1; back <= 4; back++) {
    const t = new Date(Date.now() - back * 60000);
    const name = `m-${String(t.getUTCHours()).padStart(2, "0")}${String(t.getUTCMinutes()).padStart(2, "0")}.json`;
    try { const r = await fetch(LIVE_RAW + name); if (r.ok) return await r.json(); } catch {}
  }
  return null;
}

const $ = (id) => document.getElementById(id);
const D = { status: {}, decisions: [], intraday: { points: [] }, watch: {}, events: [] };
const AG = ["claude", "watch", "news"];
const NAME = { claude: "CLAUDE", watch: "WATCHER", news: "NEWS HUNTER" };
const ROLE = { claude: "Researches every morning at 9:36 and sets the plan.", watch: "Checks every holding each minute and sells on a stop.", news: "Every hour, buys stocks that fell too hard on news." };
const COLOR = { claude: "#d9845a", watch: "#5aa9e6", news: "#b98be0" };

const NYF = new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23", weekday: "short" });
function ny(ms) {
  const p = Object.fromEntries(NYF.formatToParts(new Date(ms)).map((x) => [x.type, x.value]));
  return { date: `${p.year}-${p.month}-${p.day}`, min: +p.hour * 60 + +p.minute + +p.second / 60, wd: p.weekday };
}
const hhmm = (m) => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(Math.floor(m % 60)).padStart(2, "0")}`;
const money = (v) => "$" + Number(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = (v) => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(2) + "%";
const cls = (v) => (v > 0.005 ? "up" : v < -0.005 ? "down" : "");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function buildEvents() {
  D.events = D.decisions.filter((d) => d.date && d.time).map((d) => {
    const agent = d.source === "watch" ? "watch" : d.source === "news" ? "news" : "claude";
    const [h, m] = d.time.split(":").map(Number);
    const orders = (d.orders || []).filter((o) => o.symbol && o.side);
    const buys = orders.filter((o) => o.side === "buy").map((o) => o.symbol);
    const sells = orders.filter((o) => o.side === "sell").map((o) => o.symbol);
    const stopSells = orders.filter((o) => o.side === "sell" && /stop/i.test(o.reason || "")).map((o) => o.symbol);
    const full = orders.map((o) => `${o.side === "buy" ? "Bought" : "Sold"} ${o.symbol} ${money(o.notional)}`).join(", ");
    return { agent, date: d.date, min: h * 60 + m, orders, buys, sells, stopSells, full, summary: d.plain_summary || "" };
  }).sort((a, b) => a.date.localeCompare(b.date) || a.min - b.min);
}

// ================================================================ clock: live, or replaying a past day
const V = { mode: "live", day: null, min: 560, speed: 0.5, playing: false };
function now() {
  if (V.mode === "live") return ny(Date.now());
  const wd = new Date(V.day + "T12:00:00Z").toLocaleDateString("en-US", { weekday: "short", timeZone: "UTC" });
  return { date: V.day, min: V.min, wd };
}
const isWeekend = (t) => t.wd === "Sat" || t.wd === "Sun";
const isOpen = (t) => !isWeekend(t) && t.min >= 570 && t.min < 960;
const tradeWindow = () => (V.mode === "live" ? 8 : Math.max(5, 12 * V.speed));

// ================================================================ what each agent is doing right now
const hash = (s) => { let h = 7; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); };
const coffeeBreak = (id, t) => hash(id + t.date + Math.floor(t.min / 41)) % 5 === 0 && t.min % 41 < 3;
function lastEvent(id, t, today) {
  for (let i = D.events.length - 1; i >= 0; i--) {
    const e = D.events[i];
    if (e.agent !== id || e.date > t.date || (e.date === t.date && e.min > t.min)) continue;
    if (today && e.date !== t.date) return null;
    return e;
  }
  return null;
}
const short = (list) => list.slice(0, 3).join(", ") + (list.length > 3 ? "…" : "");
function watchLine() {
  const pos = (D.status.positions || []).filter((p) => p.current_price), highs = D.watch.highs || {};
  let worst = null;
  for (const p of pos) { const off = (p.current_price / Math.max(highs[p.symbol] || 0, p.current_price) - 1) * 100; if (!worst || off < worst.off) worst = { s: p.symbol, off }; }
  return worst && worst.off < -1 ? `${worst.s} ${worst.off.toFixed(1)}% from top` : "All holdings safe";
}
function plan(id, t) {
  const open = isOpen(t), today = lastEvent(id, t, true);
  const recent = today && t.min - today.min < tradeWindow() ? today : null;
  if (recent && recent.orders.length) {
    const stop = id === "watch" && recent.stopSells.length;
    const say = stop ? `Stop! Selling ${short(recent.stopSells)}` : recent.buys.length ? `Buying ${short(recent.buys)}!` : `Selling ${short(recent.sells)}`;
    return { spot: "term_" + id, act: "trade", say, loud: true, side: recent.buys.length ? "BUY" : "SELL", stop };
  }
  if (id === "claude") {
    if (!open) {
      if (!isWeekend(t) && t.min >= 540 && t.min < 570) return { spot: "coffee_claude", act: "stand", say: "Coffee first" };
      if (!isWeekend(t) && t.min >= 960 && t.min < 1020) return { spot: "desk", act: "read", say: "Writing today's diary" };
      return { spot: "bed_claude", act: "sleep" };
    }
    if (t.min < 576) return { spot: "coffee_claude", act: "stand", say: "Deciding at 9:36" };
    if (!today && t.min < 690) return { spot: "desk", act: "type", say: "Researching…", loud: true };
    if (coffeeBreak(id, t)) return { spot: "coffee_claude", act: "stand", say: "Coffee break" };
    return { spot: "desk", act: "read", say: today && today.buys.length ? `New picks: ${short(today.buys)}` : "Holding my picks" };
  }
  if (id === "watch") {
    if (!open) return t.min >= 960 && t.min < 1320 && !isWeekend(t) ? { spot: "arcade", act: "type", say: "Off duty!" } : { spot: "bed_watch", act: "sleep" };
    if (coffeeBreak(id, t)) return { spot: "coffee_watch", act: "stand", say: "Quick coffee" };
    return { spot: "console", act: "type", say: watchLine() };
  }
  if (!open) return !isWeekend(t) && t.min >= 960 && t.min < 1140 ? { spot: "armchair", act: "read", say: "Evening paper" } : { spot: "bed_news", act: "sleep" };
  const next = D.events.find((e) => e.agent === "news" && e.date === t.date && e.min >= t.min);
  const scanning = next ? next.min - t.min <= 5 : V.mode === "live" && t.min % 60 >= 15 && t.min % 60 < 21 && !(today && t.min - today.min < 40);
  if (scanning) return { spot: "teletype", act: "type", say: "Any big drops?", loud: true };
  if (coffeeBreak(id, t)) return { spot: "coffee_news", act: "stand", say: "Coffee break" };
  const nothing = today && !today.orders.length && t.min - today.min < 30;
  return { spot: "armchair", act: "read", say: nothing ? "Nothing worth buying" : "Reading the news" };
}

// ================================================================ drawing helpers
const W = 800, H = 500;
const cv = document.getElementById("cv");
const main = cv.getContext("2d");
// The world is laid out in 800×500 units (half a unit = one pixel). The view widens or heightens to fill the
// window; VIEW.ex / VIEW.ey are the extra units on each side, filled with street, sky and neighbours.
const VIEW = { w: W, h: H, ex: 0, ey: 0 };
main.setTransform(2, 0, 0, 2, 0, 0);
main.imageSmoothingEnabled = false;
let g = main;
const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x * 2) / 2, Math.round(y * 2) / 2, w, h); };
const OUT = "#1a1426";
const box = (x, y, w, h, fill, edge = OUT) => { R(x, y, w, h, edge); R(x + 1, y + 1, w - 2, h - 2, fill); };
function mix(hex, f) {  // f > 0 lightens towards white, f < 0 darkens
  const c = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16)).map((v) => Math.round(f > 0 ? v + (255 - v) * f : v * (1 + f)));
  return "#" + c.map((v) => Math.max(0, Math.min(255, v)).toString(16).padStart(2, "0")).join("");
}
// a shaded block: light top edge, dark bottom and right edge, outline
function block(x, y, w, h, c) { box(x, y, w, h, c); R(x + 1, y + 1, w - 2, 1, mix(c, 0.25)); R(x + 1, y + h - 2, w - 2, 1, mix(c, -0.25)); R(x + w - 2, y + 1, 1, h - 2, mix(c, -0.15)); }
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
// classic 5×7 pixel font: five column bytes per glyph, bit 0 is the top row
const F5 = {A:[124,18,17,18,124],B:[127,73,73,73,54],C:[62,65,65,65,34],D:[127,65,65,34,28],E:[127,73,73,73,65],F:[127,9,9,9,1],G:[62,65,73,73,122],H:[127,8,8,8,127],I:[0,65,127,65,0],J:[32,64,65,63,1],K:[127,8,20,34,65],L:[127,64,64,64,64],M:[127,2,12,2,127],N:[127,4,8,16,127],O:[62,65,65,65,62],P:[127,9,9,9,6],Q:[62,65,81,33,94],R:[127,9,25,41,70],S:[70,73,73,73,49],T:[1,1,127,1,1],U:[63,64,64,64,63],V:[31,32,64,32,31],W:[63,64,56,64,63],X:[99,20,8,20,99],Y:[7,8,112,8,7],Z:[97,81,73,69,67],
  "0":[62,81,73,69,62],"1":[0,66,127,64,0],"2":[66,97,81,73,70],"3":[33,65,69,75,49],"4":[24,20,18,127,16],"5":[39,69,69,69,57],"6":[60,74,73,73,48],"7":[1,113,9,5,3],"8":[54,73,73,73,54],"9":[6,73,73,41,30],
  " ":[0,0,0,0,0],".":[0,96,96,0,0],",":[0,80,48,0,0],":":[0,54,54,0,0],"%":[35,19,8,100,98],"!":[0,0,95,0,0],"?":[2,1,81,9,6],"$":[36,42,127,42,18],"/":[32,16,8,4,2],"(":[0,28,34,65,0],")":[0,65,34,28,0],"'":[0,5,3,0,0],"+":[8,8,62,8,8],"-":[8,8,8,8,8],"−":[8,8,8,8,8],"&":[54,73,85,34,80],"…":[64,0,64,0,64],"#":[20,127,20,127,20]};
function txt(s, x, y, c, k = 1) {
  for (const ch of String(s).toUpperCase()) {
    const cols = F5[ch] || F5[" "];
    for (let i = 0; i < 5; i++) for (let r = 0; r < 7; r++) if ((cols[i] >> r) & 1) R(x + i * k, y + r * k, k, k, c);
    x += 6 * k;
  }
}
const tw = (s, k = 1) => String(s).length * 6 * k - k;
function line(x0, y0, x1, y1, c, s = 1) { const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), s) / s; for (let i = 0; i <= n; i++) R(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n, s, s, c); }
function glow(x, y, r, rgb, a) { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(${rgb},${a})`); gr.addColorStop(1, `rgba(${rgb},0)`); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); }

// ================================================================ characters: one white base model, a detail per agent
// Drawn at 1 pixel = 2 world pixels. Base body is 10×16, placed at (2,3) inside a 14×19 canvas so hats fit.
const BASE_HEAD = ["..oooooo..", ".owwwwwwo.", "owwwwwwwwo", "owwwwwwwwo", "owwwwwwwwo", "owwwwwwwwo", "ogwwwwwwgo", ".oggggggo."];
const BODY = {
  stand: ["..oooooo..", "..oggggo..", "..owwwwo..", "..owwwwo..", "..owwwwo..", "..owwowo..", "..owgowo..", "..oooooo.."],
  walkA: ["..oooooo..", "..oggggo..", "..owwwwo..", "..owwwwo..", "..owwwwo..", "..owowwo..", "..ogowwo..", "..oooooo.."],
  sit: ["..oooooo..", "..oggggo..", "..owwwwo..", "..owwwwo..", "..oooooo.."],
};
const EYES = { right: [4, 7], left: [2, 5], front: [3, 6] };
const ACCENT = {
  claude: (put) => {  // orange starburst on top, orange tie
    put(6, 1, "c"); put(5, 0, "c"); put(7, 0, "c"); put(6, 0, "c"); put(6, 2, "c"); put(5, 2, "c"); put(7, 2, "c");
    put(6, 12, "c"); put(7, 12, "c"); put(6, 13, "C"); put(7, 13, "C"); put(6, 14, "c"); put(7, 14, "c");
  },
  watch: (put, dir) => {  // blue cap with a brim on the side it faces
    for (let x = 3; x <= 10; x++) { put(x, 2, "o"); put(x, 3, "b"); put(x, 4, "b"); }
    put(2, 3, "o"); put(11, 3, "o"); put(2, 4, "o"); put(11, 4, "o"); put(6, 3, "B"); put(7, 3, "B");
    const bx = dir === "left" ? [0, 1, 2] : dir === "right" ? [11, 12, 13] : [];
    for (const x of bx) { put(x, 5, "o"); put(x, 4, x === bx[1] ? "b" : "o"); }
    if (!bx.length) for (let x = 2; x <= 11; x++) put(x, 5, "B");
  },
  news: (put) => {  // purple fedora with a press card
    for (let x = 4; x <= 9; x++) { put(x, 0, "o"); put(x, 1, "p"); put(x, 2, "p"); }
    put(3, 1, "o"); put(10, 1, "o"); put(3, 2, "o"); put(10, 2, "o"); put(5, 1, "P");
    for (let x = 1; x <= 12; x++) { put(x, 3, "o"); put(x, 4, x === 1 || x === 12 ? "o" : "P"); }
    put(7, 2, "w"); put(8, 2, "w"); put(8, 1, "w");
  },
};
const SPAL = { o: "#141018", w: "#ffffff", g: "#c9c6d2", e: "#141018", c: "#e07a4a", C: "#b8582e", b: "#3f8fe0", B: "#2a6bb0", p: "#8a5cc8", P: "#5e3a96" };
const SPR = {};
function buildSprites() {
  for (const id of AG) {
    SPR[id] = {};
    for (const dir of ["right", "left", "front"]) for (const body of ["stand", "walkA", "sit"]) for (const closed of [false, true]) {
      const c = document.createElement("canvas"); c.width = 14; c.height = 19;
      const x = c.getContext("2d");
      const grid = Array.from({ length: 19 }, () => Array(14).fill("."));
      const rows = BASE_HEAD.concat(BODY[body]);
      // the head keeps its place; a sitting body is shorter, so the whole figure drops
      const oy = body === "sit" ? 3 + 3 : 3;
      rows.forEach((r, y) => [...r].forEach((k, xx) => { if (k !== ".") grid[oy + y][2 + xx] = k; }));
      const [e1, e2] = EYES[dir];
      for (const ex of [e1, e2]) {
        if (closed) { grid[oy + 4][2 + ex] = "e"; if (ex + 1 < 9) grid[oy + 4][2 + ex + (dir === "left" ? -1 : 1)] = "e"; }
        else { grid[oy + 3][2 + ex] = "e"; grid[oy + 4][2 + ex] = "e"; }
      }
      const put = (px, py, k) => { const yy = py + oy - 3; if (yy >= 0 && yy < 19 && px >= 0 && px < 14) grid[yy][px] = k; };
      ACCENT[id](put, dir);
      grid.forEach((r, y) => r.forEach((k, xx) => { if (k !== ".") { x.fillStyle = SPAL[k]; x.fillRect(xx, y, 1, 1); } }));
      SPR[id][`${dir}-${body}${closed ? "-z" : ""}`] = c;
    }
    const src = SPR[id]["front-stand-z"], ly = document.createElement("canvas"); ly.width = 19; ly.height = 14;
    const lx = ly.getContext("2d"); lx.translate(0, 14); lx.rotate(-Math.PI / 2); lx.drawImage(src, 0, 0);  // head to the left, on the pillow
    SPR[id].lying = ly;
  }
}

// ================================================================ the building: three floors and a lift

// ================================================================ heatmap of the holdings (squarified treemap)
function heatColor(p) {
  const stops = [[-3, "#f04a4f"], [-2, "#c23b42"], [-1, "#8b2f36"], [0, "#41444f"], [1, "#1e7a46"], [2, "#22a35a"], [3, "#3fd06e"]];
  const v = Math.max(-3, Math.min(3, p));
  for (let i = 1; i < stops.length; i++) if (v <= stops[i][0]) {
    const [a, ca] = stops[i - 1], [b, cb] = stops[i], f = (v - a) / (b - a);
    const A = [1, 3, 5].map((k) => parseInt(ca.slice(k, k + 2), 16)), B = [1, 3, 5].map((k) => parseInt(cb.slice(k, k + 2), 16));
    return "#" + A.map((x, k) => Math.round(x + (B[k] - x) * f).toString(16).padStart(2, "0")).join("");
  }
  return stops.at(-1)[1];
}
function squarify(items, x, y, w, h) {
  const total = items.reduce((s, i) => s + i.v, 0);
  if (!total) return [];
  const scale = (w * h) / total, out = [];
  let rest = items.slice().sort((a, b) => b.v - a.v);
  const worst = (row, side) => { const s = row.reduce((a, i) => a + i.v * scale, 0); let mx = 0, mn = Infinity; for (const i of row) { const a = i.v * scale; mx = Math.max(mx, a); mn = Math.min(mn, a); } return Math.max((side * side * mx) / (s * s), (s * s) / (side * side * mn)); };
  while (rest.length) {
    const side = Math.min(w, h);
    let row = [rest[0]], best = worst(row, side);
    for (let k = 1; k < rest.length; k++) { const c = row.concat(rest[k]), wv = worst(c, side); if (wv <= best) { row = c; best = wv; } else break; }
    const sum = row.reduce((a, i) => a + i.v * scale, 0), thick = sum / side;
    let off = 0;
    for (const it of row) { const len = (it.v * scale) / thick; out.push(w >= h ? { ...it, x, y: y + off, w: thick, h: len } : { ...it, x: x + off, y, w: len, h: thick }); off += len; }
    if (w >= h) { x += thick; w -= thick; } else { y += thick; h -= thick; }
    rest = rest.slice(row.length);
  }
  return out;
}
function heatItems() {
  return (D.status.positions || []).filter((p) => p.market_value > 0).map((p) => {
    const base = p.market_value - (p.change_today_usd || 0);
    return { s: p.symbol, name: p.name || "", v: p.market_value, pl: p.unrealized_pl || 0, today: base ? ((p.change_today_usd || 0) / base) * 100 : 0, total: (p.unrealized_plpc || 0) * 100, w8: p.weight };
  });
}
function drawHeatmap(x, y, w, h, open) {
  const items = heatItems();
  if (!items.length) { txt("NO HOLDINGS", x + (w - tw("NO HOLDINGS")) / 2, y + h / 2 - 3, "#4a5568"); return; }
  for (const c of squarify(items, x, y, w, h)) {
    const rx = Math.round(c.x), ry = Math.round(c.y), rw = Math.round(c.x + c.w) - rx, rh = Math.round(c.y + c.h) - ry;
    R(rx, ry, rw, rh, "#0b0e14"); R(rx + 1, ry + 1, rw - 2, rh - 2, open ? heatColor(c.today) : mix(heatColor(c.today), -0.35));
    const p = (c.today >= 0 ? "+" : "") + c.today.toFixed(1) + "%";
    if (rw >= tw(c.s) + 4 && rh >= 19) { txt(c.s, rx + (rw - tw(c.s)) / 2, ry + rh / 2 - 8, "#ffffff"); if (rw >= tw(p) + 4) txt(p, rx + (rw - tw(p)) / 2, ry + rh / 2 + 1, "#e8e4f0"); else if (rw >= tw(p, 0.5) + 2) txt(p, rx + (rw - tw(p, 0.5)) / 2, ry + rh / 2 + 1, "#e8e4f0", 0.5); }
    else if (rw >= tw(c.s) + 2 && rh >= 9) txt(c.s, rx + (rw - tw(c.s)) / 2, ry + (rh - 7) / 2, "#ffffff");
    else if (rw >= tw(c.s, 0.5) + 2 && rh >= 6) txt(c.s, rx + (rw - tw(c.s, 0.5)) / 2, ry + (rh - 3.5) / 2, "#ffffff", 0.5);
  }
}

// ================================================================ agents: walking, the lift, poses
const agents = {};
const lift = { floor: 1, pos: 1, target: 1, state: "idle", door: 0, rider: null, queue: [], wait: 0 };
function route(a) {
  const s = SP[a.want];
  a.phase = a.floor === s.f ? "walk" : "toLift";
}
function place(a) { const s = SP[a.want]; a.floor = s.f; a.x = s.x; a.y = FEET[s.f]; a.dir = s.dir; a.phase = "idle"; a.at = a.want; }
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const WALKING = new Set(["walk", "toLift", "enter", "exit"]);
function stepAgent(a) {
  const speed = (V.mode === "live" ? 0.6 : 1.2) * FR;
  if (a.phase === "idle" && a.at !== a.want) route(a);
  if (a.phase === "walk" && SP[a.want].f !== a.floor) route(a);
  const target = { walk: SP[a.want].x, toLift: WAIT_X, enter: INSIDE_X, exit: WAIT_X }[a.phase];
  if (target == null) return;
  const d = target - a.x;
  if (Math.abs(d) <= speed) {
    a.x = target;
    if (a.phase === "toLift") { a.phase = "wait"; a.dir = 1; if (!lift.queue.includes(a)) lift.queue.push(a); }
    else if (a.phase === "enter") a.phase = "inside";
    else if (a.phase === "exit") a.phase = "out";
    else { a.phase = "idle"; a.at = a.want; a.dir = SP[a.want].dir; }
  } else { a.x += Math.sign(d) * speed; a.dir = Math.sign(d); a.walkT = (a.walkT || 0) + FR; }
}
// idle → (moving to the caller) → opening → open (someone walks in or out) → closing → moving → …
function stepLift() {
  const L = lift, fast = (V.mode === "live" ? 1 : 1.5) * FR;
  if (L.state === "idle") {
    const next = L.queue[0];
    if (!next) return;
    if (next.floor === L.floor) L.state = "opening"; else { L.target = next.floor; L.state = "moving"; }
  } else if (L.state === "moving") {
    const d = L.target - L.pos, sp = 0.008 * fast;
    if (Math.abs(d) <= sp) {
      L.pos = L.floor = L.target; L.state = "opening";
      if (L.rider) { L.rider.floor = L.floor; L.rider.y = FEET[L.floor]; }
    } else L.pos += Math.sign(d) * sp;
  } else if (L.state === "opening") {
    L.door = Math.min(1, L.door + 0.03 * fast);
    if (L.door === 1) { L.state = "open"; L.wait = 0; L.hold = false; if (L.rider && L.rider.phase === "inside") L.rider.phase = "exit"; }
  } else if (L.state === "open") {
    L.wait += FR;
    const a = L.rider;
    if (a) {
      if (a.phase === "inside") { if (!L.hold) { L.hold = true; L.wait = 0; } else if (L.wait > 24) { L.hold = false; L.state = "closing"; } }
      else if (a.phase === "out") { L.rider = null; a.phase = "idle"; a.at = null; L.wait = 0; }
    } else {
      const i = L.queue.findIndex((q) => q.floor === L.floor);
      if (i >= 0) { L.rider = L.queue.splice(i, 1)[0]; L.rider.phase = "enter"; }
      else if (L.wait > 40) L.state = "closing";
    }
  } else if (L.state === "closing") {
    L.door = Math.max(0, L.door - 0.03 * fast);
    if (L.door === 0) {
      const a = L.rider;
      if (!a) L.state = "idle";
      else { const dest = SP[a.want].f; if (dest === L.floor) L.state = "opening"; else { L.target = dest; L.state = "moving"; } }
    }
  }
}
function resetLift() { Object.assign(lift, { state: "idle", door: 0, rider: null, queue: [], pos: lift.floor, target: lift.floor }); }
function think(instant) {
  const t = now();
  for (const id of AG) {
    const a = agents[id] || (agents[id] = { id, phase: "idle", x: 0, y: 0, dir: 1, floor: 0, want: null, at: null });
    a.plan = plan(id, t);
    const first = !a.want;
    a.want = a.plan.spot;
    if (first || instant || reduceMotion) { if (lift.rider === a) resetLift(); lift.queue = lift.queue.filter((q) => q !== a); place(a); }
    else if (a.phase === "wait" && SP[a.want].f === a.floor) { lift.queue = lift.queue.filter((q) => q !== a); route(a); }
  }
}
function frameOf(a) {
  const dir = a.dir > 0 ? "right" : "left";
  if (WALKING.has(a.phase)) { const k = ((a.walkT / 14) | 0) % 2; return { key: `${dir}-${k ? "walkA" : "stand"}`, bob: k ? -1 : 0 }; }
  if (a.phase === "wait") return { key: "right-stand", bob: 0 };
  if (a.phase === "out") return { key: "left-stand", bob: 0 };
  if (a.phase !== "idle") return { key: "front-stand", bob: 0 };
  const s = SP[a.at] || {}, act = a.plan.act, body = s.seat ? "sit" : "stand";
  if (act === "sleep") return { key: `front-${body}-z`, bob: 0 };
  const busy = act === "type" || act === "trade";
  return { key: `${dir}-${body}`, bob: busy && ((T / 45) | 0) % 2 ? -1 : 0 };  // a slow, small nod while working
}

function dayPoints(date) {

}

function live(t) {

    if (L.state === "moving") { const up = L.target < L.pos; R(745, top - 13 + (up ? 0 : 1), 3, 1, "#f2c14e"); R(746, top - 14 + (up ? 0 : 3), 1, 1, "#f2c14e"); R(746, top - 12 + (up ? 0 : -1), 1, 1, "#f2c14e"); }
    // call button: lights up while someone waits on this floor
    const calling = L.queue.some((q) => q.floor === f);
    ob(722, fy - 32, 8, 10, "#6a6476"); R(724, fy - 30, 4, 4, calling ? "#f2c14e" : "#3a3448");
  });
}

// ================================================================ sound and alerts
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const SND = { on: store.get("office-sound") === "1", ctx: null };
function actx() {
  if (!SND.ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; SND.ctx = new C(); }
  if (SND.ctx.state === "suspended") SND.ctx.resume();
  return SND.ctx;
}
function tone(freq, dur, type = "sine", gain = 0.1, delay = 0, slideTo = null) {
  const c = SND.on && actx(); if (!c) return;
  const t0 = c.currentTime + delay, o = c.createOscillator(), v = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0); if (slideTo) o.frequency.linearRampToValueAtTime(slideTo, t0 + dur);
  v.gain.setValueAtTime(gain, t0); v.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(v).connect(c.destination); o.start(t0); o.stop(t0 + dur + 0.05);
}
const MUSIC = { node: null, timer: null, bar: 0 };
const CHORDS = [[53, 57, 60, 64], [52, 55, 59, 62], [50, 53, 57, 60], [48, 52, 55, 59]];  // Fmaj7 Em7 Dm7 Cmaj7
const PENTA = [72, 74, 76, 79, 81, 84];
const hz = (m) => 440 * 2 ** ((m - 69) / 12);
function startMusic() {
  const c = actx(); if (!c || MUSIC.node) return;
  const out = c.createGain(); out.gain.value = 0.0001; out.gain.exponentialRampToValueAtTime(0.5, c.currentTime + 3);
  const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1400; lp.connect(out); out.connect(c.destination);
  // vinyl crackle: a quiet looped noise with sparse pops
  const buf = c.createBuffer(1, c.sampleRate * 2, c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * 0.012 + (Math.random() < 0.0004 ? (Math.random() - 0.5) * 0.5 : 0);
  const crackle = c.createBufferSource(); crackle.buffer = buf; crackle.loop = true; const hp = c.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 1500;
  crackle.connect(hp).connect(out); crackle.start();
  MUSIC.node = { out, lp, crackle }; MUSIC.bar = 0;
  const beat = 60 / 68, barLen = beat * 4;
  let next = c.currentTime + 0.1;
  const note = (m, t, dur, type, gain) => { const o = c.createOscillator(), v = c.createGain(); o.type = type; o.frequency.value = hz(m); o.detune.value = (Math.random() - 0.5) * 8; v.gain.setValueAtTime(0.0001, t); v.gain.exponentialRampToValueAtTime(gain, t + 0.08); v.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(v).connect(lp); o.start(t); o.stop(t + dur + 0.1); };
  const schedule = () => {
    while (next < c.currentTime + 2.5) {
      const ch = CHORDS[MUSIC.bar % 4];
      ch.forEach((m, i) => note(m, next + i * 0.03, barLen * 0.95, "triangle", 0.035));         // soft chord
      note(ch[0] - 12, next, beat * 1.8, "sine", 0.09); note(ch[0] - 12, next + beat * 2, beat * 1.6, "sine", 0.07);  // bass
      for (let b = 0; b < 4; b++) if (Math.random() < 0.45) note(PENTA[(Math.random() * PENTA.length) | 0], next + b * beat + (Math.random() < 0.5 ? beat / 2 : 0), beat * 1.5, "sine", 0.03);  // a few piano notes
      next += barLen; MUSIC.bar++;
    }
  };
  schedule(); MUSIC.timer = setInterval(schedule, 1000);
}
function stopMusic() {
  if (!MUSIC.node) return;
  const c = SND.ctx, { out, crackle } = MUSIC.node;
  out.gain.cancelScheduledValues(c.currentTime); out.gain.setValueAtTime(out.gain.value, c.currentTime); out.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 1);
  setTimeout(() => { try { crackle.stop(); out.disconnect(); } catch {} }, 1200);
  clearInterval(MUSIC.timer); MUSIC.node = null;
}
const sounds = {
  bell() { tone(1318, 1.4, "sine", 0.12); tone(1976, 1.0, "sine", 0.05); },
  ding() { tone(988, 0.6, "sine", 0.08); tone(784, 0.8, "sine", 0.08, 0.2); },
  siren() { for (let i = 0; i < 3; i++) tone(620, 0.45, "sawtooth", 0.035, i * 0.5, 940); },
  click() { tone(1800 + Math.random() * 900, 0.03, "square", 0.012); },
};
const was = {};
function soundTriggers() {
  if (!SND.on) return;
  for (const id of AG) {
    const a = agents[id], key = a.phase === "idle" ? a.at : a.phase;
    if (was[id] !== key && a.phase === "idle" && a.at === "term_" + id) { sounds.bell(); if (a.plan.stop) sounds.siren(); }
    was[id] = key;
  }
  if (was.lift !== lift.state && lift.state === "opening") sounds.ding();
  was.lift = lift.state;
  const c = agents.claude;
  if (c.phase === "idle" && c.at === "desk" && c.plan.act === "type" && Math.random() < 0.05 * FR) sounds.click();
}
const ALERTS = { on: store.get("office-alerts") === "1", seen: null };
function toast(text) {
  const el = $("toast"); el.textContent = text; el.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 9000);
}
const ICON = { claude: "🧠", watch: "⚡", news: "📰" };
function checkNewTrades() {
  const trades = D.events.filter((e) => e.orders.length), keys = trades.map((e) => `${e.date}|${e.min}|${e.agent}`);
  if (!ALERTS.seen) { ALERTS.seen = new Set(keys); return; }  // the first load only remembers what is already there
  trades.forEach((e, i) => {
    if (ALERTS.seen.has(keys[i])) return;
    ALERTS.seen.add(keys[i]);
    if (V.mode !== "live") return;
    const title = `${ICON[e.agent]} ${NAME[e.agent]}${e.stopSells.length ? " — stop-loss" : ""}`, body = e.full;
    toast(`${title}: ${body}`); sounds.bell();
    if (ALERTS.on && "Notification" in window && Notification.permission === "granted") { try { new Notification(title, { body }); } catch {} }
  });
}
function paintButtons() {
  $("soundbtn").textContent = SND.on ? "♪ SOUND ON" : "♪ SOUND OFF"; $("soundbtn").setAttribute("aria-pressed", SND.on);
  $("alertbtn").textContent = ALERTS.on ? "ALERTS ON" : "ALERTS OFF"; $("alertbtn").setAttribute("aria-pressed", ALERTS.on);
}
$("soundbtn").onclick = () => { SND.on = !SND.on; store.set("office-sound", SND.on ? "1" : "0"); if (SND.on) { actx(); startMusic(); } else stopMusic(); paintButtons(); };
$("alertbtn").onclick = async () => {
  if (!ALERTS.on && "Notification" in window && Notification.permission !== "granted") {
    try { await Notification.requestPermission(); } catch {}
    if (Notification.permission !== "granted") toast("Your browser blocked notifications for this page. Trades will still pop up here while it is open.");
  }
  ALERTS.on = !ALERTS.on; store.set("office-alerts", ALERTS.on ? "1" : "0"); paintButtons();
  if (ALERTS.on) toast("Alerts on: you'll get a notice every time an agent buys or sells while this page is open.");
};
addEventListener("pointerdown", () => { if (SND.on) { actx(); startMusic(); } }, { once: true });  // browsers only allow sound after a click

// ================================================================ HUD, agent card, big heatmap
function hud(t) {
  const s = D.status, p = s.performance || {};
  $("tl").innerHTML = s.equity == null ? "WAITING FOR DATA" :
    `${money(s.equity)}<br><span class="${cls(p.agent_return_pct)}">AI ${pct(p.agent_return_pct || 0)}</span> <span class="dim">VS</span> <span class="${cls(p.spy_return_pct)}">S&amp;P ${pct(p.spy_return_pct || 0)}</span><br><span class="dim">MARKET MOOD:</span> ${MOOD_TEXT[weatherOf()]}`;
  $("tr").innerHTML = `${V.mode === "replay" ? `<span class="dim">${esc(t.date.slice(5))}</span> ` : ""}NY ${hhmm(t.min)}<br><span class="${isOpen(t) ? "up" : "down"}">${isOpen(t) ? "● OPEN" : "● CLOSED"}</span>`;
  if (selected) card();
  if (!$("heat").hidden) heatPanel();
}
function card() {
  const id = selected, s = (D.status.scorecard || {})[id] || {};
  let line1 = "No buys yet.", line2 = "", sum = "Nothing to judge yet.";
  if (s.buys) {
    line1 = `Beat the S&amp;P on ${s.beat_spy} of ${s.buys} buys`;
    line2 = `Average vs S&amp;P: <span class="${cls(s.avg_vs_spy_pct)}">${pct(s.avg_vs_spy_pct)}</span>`;
    const share = s.beat_spy / s.buys, v = s.avg_vs_spy_pct;
    sum = v > 1 && share >= 0.6 ? "Doing well: most of its buys are ahead of the S&amp;P."
      : v > 0 ? "Slightly ahead of the S&amp;P overall."
      : v > -1 ? "Roughly level with the S&amp;P."
      : "Behind the S&amp;P so far.";
  }
  $("card").hidden = false;
  $("card").innerHTML = `<h3 style="color:${COLOR[id]}">${NAME[id]}</h3><p>${line1}</p>${line2 ? `<p>${line2}</p>` : ""}<p class="dim" style="margin-top:6px">${sum}</p>`;
}
let heatMode = "today";
function heatPanel() {
  const box = $("heatmap"), W2 = box.clientWidth, H2 = box.clientHeight;
  const cells = squarify(heatItems(), 0, 0, W2, H2), sg = (v) => (v >= 0 ? "+" : "−");
  box.innerHTML = cells.map((c) => {
    const big = c.w > 120 && c.h > 110, mid = c.w > 70 && c.h > 60, colour = heatMode === "today" ? heatColor(c.today) : heatColor(c.total * 0.3);
    const lines = [`<b style="font-size:${big ? 18 : mid ? 13 : 9}px">${esc(c.s)}</b>`];
    if (mid) lines.push(`<span>${sg(c.today)}${Math.abs(c.today).toFixed(2)}% today</span>`);
    if (big) lines.push(`<small>${esc(c.name)}</small>`, `<small>${money(c.v)} (${sg(c.pl)}${money(Math.abs(c.pl))})</small>`);
    if (mid) lines.push(`<small>Total ${sg(c.total)}${Math.abs(c.total).toFixed(1)}%</small>`);
    return `<div class="cell" style="left:${c.x}px;top:${c.y}px;width:${c.w}px;height:${c.h}px;background:${colour}" title="${esc(c.name)}">${lines.join("")}</div>`;
  }).join("") || `<p class="dim" style="padding:20px">No holdings yet.</p>`;
  $("heattitle").textContent = `YOUR HOLDINGS · COLOUR = ${heatMode.toUpperCase()}`;
  $("heatday").setAttribute("aria-pressed", heatMode === "today"); $("heattot").setAttribute("aria-pressed", heatMode === "total");
}
function toggleHeat(show) { $("heat").hidden = !show; $("heatbtn").setAttribute("aria-pressed", show); if (show) heatPanel(); }
const hitAgent = (x, y) => AG.find((id) => { const a = agents[id]; return a && lift.rider !== a && x >= a.x - 2 && x <= a.x + 22 && y >= a.y - 31 && y <= a.y + 2; });
const toWorld = (e) => [e.clientX / innerWidth * VIEW.w - VIEW.ex, e.clientY / innerHeight * VIEW.h - VIEW.ey];
const onHeatScreen = (x, y) => x >= 220 && x <= 510 && y >= 238 && y <= 322;
const DOING = { type: "working", read: "reading", sleep: "asleep", trade: "trading", stand: "on a break" };
// things you can point at; each has a short label and, where useful, a click action
const SPOTS = [
  { r: [220, 238, 290, 84], label: () => "Holdings heatmap (today) · click to enlarge", click: () => toggleHeat(true) },
  { r: [298, 80, 210, 72], label: () => "Each holding's move today", click: () => toggleHeat(true) },
  { r: [30, 238, 180, 84], label: () => "Today: AI (green) vs S&P (red)" },
  { r: [30, 210, 680, 24], label: () => "Your holdings, scrolling" },
  { r: [662, 78, 54, 38], label: () => "News Hunter's latest note · click to read", click: () => newsCard() },
  { r: [24, 352, 96, 70], label: () => "Top agent vs the S&P · click for details", click: () => { const b = bestAgent(); if (b) { selected = b.id; card(); } } },
  { r: [-1e4, -1e4, 2e4, 1e4 + 44], label: () => `Market mood: ${MOOD_TEXT[weatherOf()].toLowerCase()} (${weatherOf()})` },
];
const spotAt = (x, y) => SPOTS.find(({ r }) => x >= r[0] && x <= r[0] + r[2] && y >= r[1] && y <= r[1] + r[3]);
function newsCard() {
  const e = [...D.events].reverse().find((v) => v.agent === "news");
  selected = null; $("card").hidden = false;
  $("card").innerHTML = `<h3 style="color:${COLOR.news}">NEWS HUNTER · LATEST</h3><p>${esc(e ? e.summary || e.full || "Checked the news." : "No news checks yet.")}</p>${e ? `<p class="dim" style="margin-top:6px">${esc(e.date.slice(5))} at ${hhmm(e.min)} NY</p>` : ""}`;
}
cv.addEventListener("click", (e) => {
  const [x, y] = toWorld(e);
  const hitA = hitAgent(x, y), sp = !hitA && spotAt(x, y);
  if (sp && sp.click) { sp.click(); return; }
  const hit = hitA;
  selected = hit && hit !== selected ? hit : null;
  if (selected) card(); else $("card").hidden = true;
});
let tipTimer = 0;
cv.addEventListener("pointermove", (e) => {
  if (e.pointerType !== "mouse") return;
  clearTimeout(tipTimer); tipTimer = setTimeout(() => { $("tip").hidden = true; }, 3500);
  const [x, y] = toWorld(e), a = hitAgent(x, y), sp = !a && spotAt(x, y), tip = $("tip");
  const text = a ? `${NAME[a]} · ${DOING[agents[a].plan.act] || "busy"} · click for details` : sp ? sp.label() : "";
  cv.style.cursor = a || (sp && sp.click) ? "pointer" : "default";
  tip.hidden = !text; if (!text) return;
  tip.textContent = text;
  tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + "px"; tip.style.top = Math.max(8, e.clientY - 30) + "px";
});
cv.addEventListener("mouseleave", () => { $("tip").hidden = true; });
$("heatbtn").onclick = () => toggleHeat($("heat").hidden);
$("heatclose").onclick = () => toggleHeat(false);
$("heatday").onclick = () => { heatMode = "today"; heatPanel(); };
$("heattot").onclick = () => { heatMode = "total"; heatPanel(); };
addEventListener("keydown", (e) => { if (e.key === "Escape") toggleHeat(false); });
function fit() {
  const a = innerWidth / innerHeight, vw = Math.max(W, H * a), vh = Math.max(H, W / a);
  Object.assign(VIEW, { w: vw, h: vh, ex: (vw - W) / 2, ey: (vh - H) / 2 });
  for (const c of [cv, bg]) { c.width = Math.round(vw * 2); c.height = Math.round(vh * 2); }
  main.setTransform(2, 0, 0, 2, VIEW.ex * 2, VIEW.ey * 2); main.imageSmoothingEnabled = false;
  bgKey = ""; if (!$("heat").hidden) heatPanel();
  $("hint").hidden = !(innerHeight > innerWidth * 1.15 && innerWidth < 700);
}
addEventListener("resize", fit);

function tradingDays() { return [...new Set(D.events.map((e) => e.date))].slice(-15).reverse(); }
function setMode(mode) {
  V.mode = mode;
  $("replay").textContent = mode === "live" ? "REPLAY" : "● BACK TO LIVE"; $("replay").setAttribute("aria-pressed", mode === "replay");
  $("day").hidden = $("speed").hidden = mode === "live";
  think(true); bgKey = ""; lastHud = -1;
}
function startReplay(day) {
  const days = tradingDays();
  $("day").innerHTML = days.map((d) => `<option value="${d}">${d.slice(5)}</option>`).join("");
  V.day = day || days.find((d) => D.events.some((e) => e.date === d && e.orders.length)) || days[0];
  $("day").value = V.day; V.min = 560; V.playing = true;
  setMode("replay");
}
$("replay").onclick = () => (V.mode === "live" ? startReplay() : setMode("live"));
$("day").onchange = () => startReplay($("day").value);
$("speed").onclick = () => { V.speed = V.speed === 0.5 ? 2 : V.speed === 2 ? 0.1 : 0.5; $("speed").textContent = { 0.5: "30×", 2: "120×", 0.1: "6×" }[V.speed]; };

async function refreshAll() {
  const [status, decisions, intraday, watch] = await Promise.all([load("status.json", D.status), load("decisions.json", D.decisions), load("intraday.json", D.intraday), load("watch.json", D.watch)]);
  Object.assign(D, { status: status || {}, decisions: decisions || [], intraday: intraday && intraday.points ? intraday : { points: [] }, watch: watch || {} });
  buildEvents(); checkNewTrades(); lastHud = -1;
}
async function refreshLive() {
  if (document.visibilityState !== "visible") return;
  const lv = await fetchLive();
  if (!lv) return;
  const st = lv.status || {};
  if (st.updated && (!D.status.updated || new Date(st.updated) >= new Date(D.status.updated))) D.status = st;
  const pts = (D.intraday.points || []).slice(), seen = new Set(pts.map((p) => p[0]));
  for (const p of lv.intraday_tail || []) if (!seen.has(p[0])) pts.push(p);
  D.intraday = { points: pts.sort((a, b) => a[0].localeCompare(b[0])) };
  lastHud = -1;
}
(async () => {
  fit(); buildSprites(); paintButtons();
  await refreshAll();
  think(true);
  requestAnimationFrame((ts) => { lastTs = ts; frame(ts); });
  refreshLive();
  setInterval(refreshLive, 61000);
  setInterval(refreshAll, 3 * 60000);
})();
